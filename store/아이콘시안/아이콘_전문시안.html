<!doctype html><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;background:#eceef3;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:860px;margin:0 auto}
.c{text-align:center}.c p{margin:12px 0 0;font-weight:800;font-size:15px}.c small{display:block;font-weight:600;color:#666;font-size:12px;margin-top:2px}
.ic{width:220px;height:220px;margin:0 auto;border-radius:50px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(20,20,60,.22)}
.ic svg{position:absolute;inset:0;width:100%;height:100%}
.ic b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Zen Kaku Gothic New",sans-serif;color:#fff}
.a{background:linear-gradient(160deg,#3b3fb6,#2a2d86)}
.a b{font-weight:700;font-size:150px;padding-bottom:8px}
.b{background:#14163a}
.b b{font-family:"Shippori Mincho",serif;font-weight:800;font-size:112px;padding-bottom:6px}
.c1{background:#f7f5ef}
.c1 b{color:#2f33a8;font-weight:900;font-size:140px;padding-bottom:6px}
.d{background:linear-gradient(160deg,#4b3fd0,#2b2a8a)}
.e{background:#1b1d2a}
.e b{font-weight:700;font-size:92px;letter-spacing:2px;padding-bottom:10px}
.f{background:linear-gradient(150deg,#6a4cf0,#3a2fb5)}
.f b{font-weight:700;font-size:104px;padding-bottom:6px}
</style><body><div class="g">
<div class="c"><div class="ic a"><b>す</b></div><p>A. 인디고 + 얇은 「す」<small>깔끔한 단색 느낌, 학습 서비스 같은 인상</small></p></div>
<div class="c"><div class="ic b"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="78" fill="none" stroke="#d9b45a" stroke-width="3"/></svg><b>す</b></div><p>B. 남색 + 금색 원 + 명조 「す」<small>고급스럽고 일본다운 인상</small></p></div>
<div class="c"><div class="ic c1"><b>す</b><svg viewBox="0 0 220 220"><circle cx="170" cy="52" r="13" fill="#d8352a"/></svg></div><p>C. 아이보리 + 인디고 「す」 + 붉은 점<small>일본 미니멀, 눈에 확 띄는 대비</small></p></div>
<div class="c"><div class="ic d"><svg viewBox="0 0 220 220"><path d="M110 62 C88 50 62 50 42 58 V152 C62 144 88 144 110 156 C132 144 158 144 178 152 V58 C158 50 132 50 110 62Z" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-width="7" stroke-linejoin="round"/><path d="M110 62V156" stroke="#fff" stroke-width="7"/><circle cx="110" cy="170" r="0"/><path d="M70 92h22M70 112h22M128 92h22M128 112h22" stroke="#ffd66b" stroke-width="7" stroke-linecap="round"/></svg></div><p>D. 펼친 책 + 노란 줄<small>공부·교재 앱임이 바로 보임</small></p></div>
<div class="c"><div class="ic e"><b>すら</b><svg viewBox="0 0 220 220"><rect x="52" y="158" width="116" height="7" rx="3.5" fill="#8c7bff"/></svg></div><p>E. 차콜 + 「すら」 + 보라 밑줄<small>세련된 다크 스타일</small></p></div>
<div class="c"><div class="ic f"><svg viewBox="0 0 220 220"><path d="M110 28 A82 82 0 1 0 190 120" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-opacity=".95"/></svg><b>す</b></div><p>F. 보라 + 붓 원(엔소) + 「す」<small>일본 서예 느낌, 상징적</small></p></div>
</div></body>
