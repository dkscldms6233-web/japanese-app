<!doctype html><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;background:#eceef3;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:860px;margin:0 auto}
.c{text-align:center}.c p{margin:12px 0 0;font-weight:800;font-size:15px}.c small{display:block;font-weight:600;color:#666;font-size:12px;margin-top:2px}
.ic{width:220px;height:220px;margin:0 auto;border-radius:50px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(20,20,60,.22)}
.ic svg{position:absolute;inset:0;width:100%;height:100%}
.ic b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;color:#fff;font-size:150px;padding-bottom:10px}
.a{background:linear-gradient(160deg,#4a4ee0,#2a2d86)}
.b{background:#ffc93c}.b b{color:#2b2f9e}
.c1{background:linear-gradient(135deg,#6a4cf0 0%,#ff6fa8 100%)}
.d{background:#2f33a8}
.e{background:linear-gradient(160deg,#4a4ee0,#2a2d86)}.e b{color:#2b2f9e;font-size:130px;padding-bottom:6px}
.f{background:#1f2370}.f b{color:#ffc93c}
</style><body><div class="g">
<div class="c"><div class="ic a"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="84" fill="#ffc93c"/></svg><b style="color:#2b2f9e">す</b></div><p>A. 인디고 + 노란 원 + 남색 「す」<small>원색 대비로 눈에 띔</small></p></div>
<div class="c"><div class="ic b"><b>す</b><svg viewBox="0 0 220 220"><circle cx="172" cy="50" r="14" fill="#e8402f"/></svg></div><p>B. 노랑 + 남색 「す」 + 붉은 점<small>스토어에서 가장 눈에 띄는 색</small></p></div>
<div class="c"><div class="ic c1"><svg viewBox="0 0 220 220"><circle cx="180" cy="40" r="70" fill="#fff" fill-opacity=".12"/><circle cx="30" cy="200" r="60" fill="#fff" fill-opacity=".1"/></svg><b>す</b></div><p>C. 보라→핑크 그라데이션 + 「す」<small>화사하고 요즘 앱 느낌</small></p></div>
<div class="c"><div class="ic d"><svg viewBox="0 0 220 220"><g transform="rotate(-8 110 110)"><rect x="46" y="38" width="128" height="144" rx="22" fill="#fff"/></g><rect x="0" y="0" width="0" height="0"/></svg><b style="color:#2f33a8;font-size:118px;transform:rotate(-8deg);padding-bottom:4px">す</b><svg viewBox="0 0 220 220"><circle cx="164" cy="60" r="12" fill="#e8402f"/></svg></div><p>D. 인디고 + 흰 단어 카드 + 「す」<small>플래시카드 = 공부 앱 느낌</small></p></div>
<div class="c"><div class="ic e"><svg viewBox="0 0 220 220"><rect x="40" y="40" width="140" height="140" rx="34" fill="#fff"/><circle cx="162" cy="58" r="17" fill="#ffc93c"/></svg><b>す</b></div><p>E. 인디고 + 흰 둥근 사각 + 노란 점<small>앱 안의 앱 느낌, 깔끔하게 강조</small></p></div>
<div class="c"><div class="ic f"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="86" fill="none" stroke="#ffc93c" stroke-width="8"/></svg><b>す</b></div><p>F. 짙은 남색 + 노란 굵은 링 + 노란 「す」<small>고급 + 포인트색</small></p></div>
</div></body>
