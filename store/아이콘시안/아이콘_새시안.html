<!doctype html><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@900&family=Jua&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:16px;background:#e9eaf2;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:760px;margin:0 auto;zoom:.7}
.c{text-align:center}.c p{margin:8px 0 0;font-weight:800;font-size:14px}.c small{display:block;font-weight:600;color:#555;font-size:11px}
.ic{width:200px;height:200px;margin:0 auto;border-radius:46px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(30,30,80,.25)}
.a{background:linear-gradient(145deg,#6a5cff,#9a6bff)}
.a b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 128px "Mochiy Pop One","Zen Maru Gothic",sans-serif;color:#fff;text-shadow:0 6px 0 rgba(40,20,120,.28);padding-bottom:8px}
.a i{position:absolute;right:30px;top:26px;width:22px;height:22px;background:#ffd66b;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.b{background:linear-gradient(145deg,#5b5bf0,#8a63ff)}
.b .bub{position:absolute;left:24px;right:24px;top:34px;bottom:56px;background:#fff;border-radius:34px;display:flex;align-items:center;justify-content:center;font:400 78px "Mochiy Pop One","Zen Maru Gothic",sans-serif;color:#4a3fd8;letter-spacing:-2px}
.b .bub:after{content:"";position:absolute;left:36px;bottom:-24px;border:18px solid transparent;border-top:26px solid #fff;border-bottom:0;border-left-width:6px}
.b .dot{position:absolute;right:30px;bottom:28px;width:26px;height:26px;border-radius:50%;background:#ffd66b}
.c1{background:#fffaf0;border:2px solid #efe6cf}
.c1 .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 64px/1.0 "Mochiy Pop One","Zen Maru Gothic",sans-serif;color:#4a3fd8}
.c1 .u{position:absolute;left:34px;right:34px;bottom:34px;height:12px;background:#ffc83a;border-radius:6px}
.d{background:linear-gradient(145deg,#6a5cff,#9a6bff)}
.d img{position:absolute;left:50%;top:50%;width:150px;transform:translate(-50%,-48%);border-radius:50%;background:#fffdf4;padding:8px;box-sizing:content-box}
.e{background:#ffc83a}
.e .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 78px "Mochiy Pop One",sans-serif;color:#2b2a6e;padding-bottom:14px;white-space:nowrap}
.e .r{position:absolute;right:26px;bottom:28px;width:46px;height:46px;border:9px solid #e0392a;border-radius:50%;box-sizing:border-box}
.f{background:linear-gradient(160deg,#2a2a78,#5b3fd0)}
.f .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 110px "Mochiy Pop One",sans-serif;color:#fff;padding-bottom:38px}
.f i{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(255,255,255,.14)}
.f s{position:absolute;left:30px;bottom:20px;color:#ffd66b;font:800 22px sans-serif;letter-spacing:.14em;text-decoration:none}
</style><body><div class="g">
<div class="c"><div class="ic a"><b>す</b><i></i></div><p>A. 보라 + 큰 「す」<small>단순하고 또렷한 한 글자</small></p></div>
<div class="c"><div class="ic b"><div class="bub">すら</div><span class="dot"></span></div><p>B. 보라 + 흰 말풍선 「すら」<small>지금 아이콘의 말풍선을 깔끔하게</small></p></div>
<div class="c"><div class="ic c1"><div class="t"><span>すら</span><span>すら</span></div><span class="u"></span></div><p>C. 크림 + 굵은 글자<small>앱 배경색과 같은 차분한 느낌</small></p></div>
<div class="c"><div class="ic d"><img src="mascot.png"></div><p>D. 보라 + 참새 마스코트<small>친근함, 캐릭터 중심</small></p></div>
<div class="c"><div class="ic e"><div class="t">すら</div><span class="r"></span></div><p>E. 노랑 + 「すら」 + 빨간 ○<small>지금 아이콘의 색감을 정돈</small></p></div>
<div class="c"><div class="ic f"><div class="t">す</div><i></i><s>JLPT</s></div><p>F. 남색 + 「す」 + JLPT 띠<small>시험 공부 앱이 바로 보이는 안</small></p></div>
</div></body>
