<!doctype html><meta charset=utf-8><link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet"><style>
body{margin:0;padding:28px;background:#eceef3;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;max-width:860px;margin:0 auto}
.c{text-align:center}.c p{margin:12px 0 0;font-weight:800;font-size:15px}.c small{display:block;font-weight:600;color:#666;font-size:12px;margin-top:2px}
.ic{width:220px;height:220px;margin:0 auto;border-radius:50px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(20,20,60,.22);background:#2f33a8}
.ic svg{position:absolute;inset:0;width:100%;height:100%}
.ic b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900}

"128" height="144" rx="22" fill="#fff"/></g></svg><b style="color:#2f33a8;font-size:118px;transform:rotate(-8deg);padding-bottom:4px">す</b><svg viewBox="0 0 220 220"><circle cx="168" cy="58" r="24" fill="#ffc93c"/><path d="M157 58l8 8 14-16" fill="none" stroke="#2f33a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><p>E. 카드 위 노란 체크 배지<small>'맞았다' 느낌, 시험 공부 연상</small></p></div><div class="c"><div class="ic d" style=""><svg viewBox="0 0 220 220"><g transform="rotate(-8 110 110)"><rect x="46" y="50" width="128" height="144" rx="22" fill="#ffc93c"/></g><g transform="rotate(-8 110 110)"><rect x="46" y="38" width="128" height="144" rx="22" fill="#fff"/></g></svg><b style="color:#2f33a8;font-size:118px;transform:rotate(-8deg);padding-bottom:4px">す</b><svg viewBox="0 0 220 220"></svg></div><p>F. 카드 아래 노란 그림자 판<small>입체감, 아이콘이 통통 떠 보임</small></p></div></div>
