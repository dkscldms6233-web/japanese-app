<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すらすら日本語 - 술술 일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@500;800&family=Gaegu&family=Yusei+Magic&family=Gowun+Dodum&family=Zen+Maru+Gothic&family=Hi+Melody&family=Kiwi+Maru&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --text:#2b2420; --sub:#6b5f57; --line:#eadfcf;
  --accent:#d63d22; --accent-dk:#a82d17; --accent-soft:#fbe5dd; --chip:#f2e9db; --onacc:#fff;
  --on:#1f5fb0; --kun:#237a46; --lvfg:#fff;
  --n5:#2e8b57; --n4:#2a7fc4; --n3:#b07d00; --n2:#d9631e; --n1:#c62f3f; --nx:#6b6b73;
  --pn:#2a6fb5; --pv:#237a46; --pa:#8a3fb0;
}
:root{color-scheme:light; --g1:#fff1e4; --g2:#fff8ec; --gold:#e6a100;}
:root[data-theme=dark]{ color-scheme:dark; --g1:#2a1b14; --g2:#231913; --gold:#f5c542;
  --bg:#17120f; --card:#221b17; --text:#f6eee6; --sub:#b9aa9c; --line:#3a2f28;
  --accent:#ff7a5c; --accent-dk:#c4553b; --accent-soft:#3d231b; --chip:#2d241e; --onacc:#1a0f0b;
  --on:#8ab8f5; --kun:#7fd8a2; --lvfg:#111;
  --n5:#55c98a; --n4:#62b0f0; --n3:#e8b83c; --n2:#f08a4b; --n1:#ff7080; --nx:#9a9aa4;
  --pn:#8ab8f5; --pv:#7fd8a2; --pa:#d3a3ee; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;
  font-family:-apple-system,"Hiragino Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 헤더 / 탭 ---- */
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 8px}
@media(min-width:700px){header{position:sticky;top:0;z-index:5}}
.hin{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
h1{margin:0;font-size:22px}
h1 span{color:var(--accent)}
#logo{display:flex;flex-direction:column;line-height:1.05}
#logo .lgm{font-family:"Mochiy Pop One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:400;font-size:25px;letter-spacing:.03em;text-shadow:2px 2px 0 var(--accent-soft)}
#logo small{align-self:flex-start;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:10.5px;line-height:1;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px 3px 10px;margin-top:5px}
.views{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.vb{border:none;background:none;color:var(--sub);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600;display:flex;gap:6px;align-items:center}
.vb.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.vb i{font-style:normal}
@media(max-width:699px){
  body{padding-bottom:76px}
  .views{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:var(--card);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .vb{flex-direction:column;gap:0;font-size:12px;padding:6px 0;border-radius:8px}
  .vb i{font-size:20px}
  .vb.on{box-shadow:none;color:var(--accent);background:var(--accent-soft)}
}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
.pill.on{background:var(--accent);border-color:var(--accent);border-bottom:3px solid var(--accent-dk);color:var(--onacc)}
.pill.add{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.pill:disabled{opacity:.4;cursor:default}
.pill.sm{padding:2px 10px;font-size:13px;font-weight:600}
.opts{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin:6px 0 2px}
label.tg{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
select,textarea,.af input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px}
[data-view=quiz] .list-only{display:none}
[data-view=list][data-stage=pick] :is(.list-only,.levels,.opts){display:none}
.pick{max-width:820px;margin:10px auto}
.pick h2{margin:6px 0 2px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
@media(min-width:700px){.pkgrid.five{grid-template-columns:repeat(5,1fr)}.pkgrid.four{grid-template-columns:repeat(4,1fr)}}
.pk{position:relative;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:18px 14px 14px;text-align:left;cursor:pointer;font:inherit;transition:transform .12s,border-color .12s}
.pk::before{content:"";position:absolute;left:14px;top:0;width:34px;height:5px;border-radius:0 0 4px 4px;background:var(--lvc,var(--accent))}
.pk:hover{border-color:var(--accent);transform:translateY(-2px)}
.pk b{display:block;font-size:26px;line-height:1.2}
.pk small{display:block;color:var(--sub);margin-top:2px;font-size:13px}
.pk em{display:block;font-style:normal;font-size:13px;margin-top:6px;color:var(--text)}
.pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.pkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:6px}
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pbar select{max-width:100%;flex:1;min-width:150px}
.pg{justify-content:center}
[data-view=news] :is(.list-only,.levels,.opts),[data-view=stats] :is(.list-only,.levels,.opts),
[data-view=home] :is(.list-only,.levels,.opts),[data-view=today] :is(.list-only,.levels,.opts),[data-view=read] :is(.list-only,.levels,.opts){display:none}

main{max-width:960px;margin:0 auto;padding:12px 16px 40px}
.count{font-size:14px;color:var(--sub);margin:2px 0 10px}
.sub{color:var(--sub);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:40px 0}

/* ---- 급수 뱃지 / 품사 태그 ---- */
.lvb{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;color:var(--lvfg);background:var(--nx);line-height:1.6;vertical-align:middle}
.lv-N5{background:var(--n5)}.lv-N4{background:var(--n4)}.lv-N3{background:var(--n3)}.lv-N2{background:var(--n2)}.lv-N1{background:var(--n1)}
.lc-N5{--lc:var(--n5)}.lc-N4{--lc:var(--n4)}.lc-N3{--lc:var(--n3)}.lc-N2{--lc:var(--n2)}.lc-N1{--lc:var(--n1)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
.tag.pn{--c:var(--pn)}.tag.pv{--c:var(--pv)}.tag.pa{--c:var(--pa)}
.tag.pn,.tag.pv,.tag.pa{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}

/* ---- 단어 카드 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lc,var(--nx));border-radius:14px;padding:12px 14px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ctop{display:flex;justify-content:space-between;align-items:center}
.card .w{font-size:34px;line-height:1.9;margin-top:2px}
.card .m{font-size:17px;font-weight:600;margin-bottom:6px}
.star{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);padding:0 4px;line-height:1}
.star.on{color:#e0a800}
.hide .card .m{filter:blur(8px);transition:filter .15s}
.hide .card:hover .m{filter:none}
rt{font-size:.52em;color:var(--sub)}
.nofuri rt{visibility:hidden}
.nofuri ruby:hover rt{visibility:visible}

/* ---- 상세 화면 ---- */
dialog{width:min(680px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 0}
.dh .big{font-size:48px;line-height:1.8}
.dtools{display:flex;gap:6px}
.x{border:none;background:var(--chip);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:17px}
.x.starb.on{color:#e0a800}
.db{padding:0 20px 20px}
.mean{font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.posbox{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.posbox b{color:var(--accent)}
h3{font-size:15px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.note{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.kj{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.kj .c{font-size:44px;line-height:1.2;text-align:center}
.kj .ko{font-size:13px;color:var(--sub);text-align:center}
.r{font-size:14px}
.on-t{color:var(--on);font-weight:700}
.kun-t{color:var(--kun);font-weight:700}
.tip{font-size:14px;margin-top:4px;background:var(--chip);border-radius:8px;padding:4px 10px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.rel small{display:block;color:var(--sub);font-size:12px}
.rel .lnk{cursor:pointer}
.ex{background:var(--chip);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.ex .ja{font-size:19px;line-height:2.1}
.ex .ko{font-size:14px;color:var(--sub)}
.dnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.dnav .del{color:#c0392b;border-color:#c0392b}

/* ---- 단어 추가 폼 ---- */
.af label{display:block;margin:12px 0 0;font-size:14px;font-weight:600}
.af label small{font-weight:400;color:var(--sub);margin-left:4px}
.af input,.af select,.af textarea{width:100%;margin-top:4px;display:block}
.af .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- 퀴즈 ---- */
.qbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.qbox{max-width:620px;margin:16px auto;text-align:center}
.qbox h2{margin:8px 0}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{border:1.5px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--text);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font-size:15px}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--sub)}
.prog{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:4px 0 6px}
.prog div{height:100%;background:var(--accent);transition:width .2s}
.qw{font-size:54px;margin:24px 0 12px;line-height:1.8}
.qw.s{font-size:30px;margin:10px 0 2px}
.qm{font-size:22px;font-weight:700;margin-bottom:6px}
.opts4{display:grid;gap:8px;margin-top:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:13px 14px;font-size:18px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{color:var(--text);cursor:default}
.opt.correct{background:#d8f0e0;border-color:#2e7d4f;color:#12361f}
.opt.wrong{background:#f8d7d3;border-color:#c0392b;color:#4a1511}
kbd{display:inline-block;min-width:20px;text-align:center;font-size:12px;background:var(--chip);color:var(--sub);border-radius:5px;margin-right:8px;padding:0 4px}
.reveal{margin-top:14px;padding:10px;border-radius:12px;background:var(--chip)}
.score{font-size:52px;font-weight:800;color:var(--accent);margin:12px 0}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:14px 0 10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ans.ok{border-color:#2e7d4f;background:#d8f0e022}
.ans.ng{border-color:#c0392b;background:#f8d7d322}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ck{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font-size:20px;cursor:pointer}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.gcol{display:grid;gap:8px;align-content:start}
.gcols .opt{text-align:center;font-size:17px;padding:10px 8px;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.3}
.gcols .opt small{font-size:12px;color:var(--sub);font-weight:500}
.gcols .opt{position:relative}
.gcols .opt.good{cursor:default}
.gcols .gst2{position:absolute;top:2px;right:2px;padding:2px;line-height:0;color:var(--sub);opacity:.55;cursor:pointer;background:none;border:none}
.gcols .gst2 .ic{width:20px;height:20px}
.gcols .gst2.on{color:#e0a800;opacity:1}
.gcols .gst2.on .ic{fill:currentColor}
.glist{text-align:left;margin:6px 0 4px}
.grow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.grow .gw{font-size:20px;min-width:88px}
.grow .gk{flex:1;color:var(--sub);font-size:15px}
.grow .star{flex:none}
.gtag{display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;margin-right:4px;white-space:nowrap}
.gtag.ng{background:#f8d7d3;color:#4a1511}
.gtag.ok{background:#d8f0e0;color:#12361f}
.gtag.no{background:var(--chip);color:var(--sub)}
.gtag.q{background:var(--accent-soft);color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.opt.good{background:#d8f0e0;border-color:#2e7d4f;color:#12361f;opacity:.4}
.opt.good small{color:#12361f}
.opt.bad{background:#f8d7d3;border-color:#c0392b;color:#4a1511;animation:gshake .3s}
@keyframes gshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gstat{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:2px 2px 6px}
.hp{display:inline-flex;gap:4px}
.hp i{width:12px;height:12px;border-radius:50%;background:#c0392b}
.hp i.off{background:var(--chip)}
.newbest{display:inline-block;background:var(--accent);color:var(--onacc);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.gbox{--gfont:"Jua","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Arial Rounded MT Bold",sans-serif;font-family:var(--gfont)}
#quizView[data-gf=hand] .gbox{--gfont:"Gaegu","Yusei Magic","Hiragino Maru Gothic ProN",sans-serif}
#quizView[data-gf=soft] .gbox{--gfont:"Gowun Dodum","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
#quizView[data-gf=pop] .gbox{--gfont:"Hi Melody","Kiwi Maru","Hiragino Maru Gothic ProN",sans-serif}
#quizView[data-gf=hand] .gbox .opt{font-size:21px}
#quizView[data-gf=hand] .gbox .opt small,#quizView[data-gf=hand] .gbox .gstat,#quizView[data-gf=hand] .gbox .sub{font-size:15px}
#quizView[data-gf=hand] .gbox .gcols .opt small{font-size:13px}
#quizView[data-gf=pop] .gbox .opt{font-size:19px}
#quizView[data-gf=pop] .gbox .gstat,#quizView[data-gf=pop] .gbox .sub{font-size:15px}
.gbox,.gbox *{font-weight:400}
.gbox .qw{letter-spacing:.04em}
.gbox .score{font-size:60px}
.gbox .rank{font-size:24px}
.gbox kbd{font-family:var(--gfont)}
.gbox{position:relative;overflow:hidden;padding:16px 14px 18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--g1),var(--g2))}
.gbox .prog{height:12px;border-radius:8px;background:rgba(127,127,150,.25)}
.gbox .prog div{border-radius:8px;transition:width .15s linear,background .3s}
#gbar.mid{background:#e8890c}
#gbar.low{background:#d6336c;animation:gblink .5s infinite alternate}
@keyframes gblink{to{opacity:.45}}
.gbox .gstat span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.gbox .gstat .hp{padding:6px 10px}
.gbox .opt{transition:transform .1s,border-color .1s}
.gbox .opt:hover:not(:disabled){transform:translateY(-2px)}
.gbox .opt.correct{animation:gpop .35s}
.gbox .opt.good.just{animation:gflash .7s}
@keyframes gpop{40%{transform:scale(1.07)}}
@keyframes gflash{0%{opacity:1;transform:scale(1.1);box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold)}100%{opacity:.4;transform:scale(1);box-shadow:none}}
.hp svg{width:22px;height:22px;fill:#e63950;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.hp svg.off{fill:var(--chip);stroke:#9aa0ac;stroke-width:1.5;filter:none}
.hp svg.pop{animation:gbreak .7s}
@keyframes gbreak{0%{transform:scale(1.6) rotate(0)}30%{transform:scale(1.3) rotate(-18deg)}60%{transform:scale(.8) rotate(14deg)}100%{transform:scale(1) rotate(0)}}
.cdbox{padding-bottom:22px}
.cdnum{font-size:112px;line-height:1.15;margin:4px 0 6px;color:var(--accent);animation:gcd .85s ease-out}
@keyframes gcd{0%{transform:scale(1.9);opacity:0}25%{opacity:1}100%{transform:scale(1)}}
.cdmk{display:flex;justify-content:center;margin-top:6px}
.cdmk svg{width:72px;height:72px;transform-origin:50% 100%;animation:gmhop .55s ease-in-out infinite}
.mbar{position:relative;padding-top:52px}
.monk{position:absolute;top:2px;width:46px;height:46px;transition:left .12s linear;pointer-events:none}
.monk svg{width:46px;height:46px;overflow:visible;transform-origin:50% 100%;animation:gmhop .55s ease-in-out infinite}
.monk.fast svg{animation-duration:.3s}
@keyframes gmhop{0%,100%{transform:translateY(2px) rotate(-4deg) scale(1.08,.9)}50%{transform:translateY(-11px) rotate(6deg) scale(.96,1.06)}}
.monk .tail{transform-origin:30px 41px;animation:gtail .3s ease-in-out infinite alternate}
@keyframes gtail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.gfx{position:absolute;left:0;right:0;top:104px;height:0;pointer-events:none;z-index:5}
.gfx b{position:absolute;left:0;right:0;text-align:center;font-size:24px;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.25);animation:gfloat .95s ease-out forwards}
.gfx b.pts{top:36px}
.gfx b.cmb{top:-8px;font-size:34px}
.gfx b.c5{color:#e8590c;font-size:42px}
.gfx b.c10{color:#d6336c;font-size:50px}
.gfx b.clr{top:70px;font-size:26px;color:#2e9e5b}
.gfx b.neg{color:#d6336c}
@keyframes gfloat{0%{opacity:0;transform:translateY(12px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.18)}100%{opacity:0;transform:translateY(-34px) scale(1)}}

/* ---------- 데이터 ----------
 표기법: 한자[읽기]  예) 食[た]べる  → 食 위에 'た' 후리가나
*/
const POS = {
  "名詞":["명사","사물·사람·개념을 나타내는 말. 조사(が, を, は)가 뒤에 붙어요."],
  "名詞・する":["명사 + する 동사","する를 붙여 동사로 쓸 수 있는 명사. 예: 勉強 → 勉強する (공부하다)"],
  "一段動詞":["동사 · 2그룹(일단동사)","끝이 る. る를 떼고 ます를 붙임. 예: 食べる → 食べます"],
  "五段動詞":["동사 · 1그룹(오단동사)","끝 글자가 う단(う,く,す,む,る…)에서 활용. 예: 飲む → 飲みます / 飲まない"],
  "い形容詞":["い형용사","끝이 い. 그대로 명사를 꾸밈. 예: 高い本 / 부정: 高くない"],
  "な形容詞":["な형용사","명사 앞에서 な가 붙음. 예: 静かな町 / 부정: 静かではない"],
  "自動詞":["자동사","목적어(を) 없이 스스로 일어나는 일."],
  "副詞":["부사","동사·형용사 등을 꾸미는 말. 활용하지 않아요."],
  "不規則動詞":["불규칙 동사","来る(くる)와 する 두 개뿐. 따로 외워야 해요."],
  "他動詞":["타동사","を로 목적어를 받아 '~을 …하다'."]
};

function kanjiBlocks(w){
  const re = new RegExp("(["+KJ+"]+)\\[([^\\]]+)\\]","g"), out=[]; let m;
  while((m = re.exec(w.f))) out.push([m[1],m[2]]);
  const base = s => toKata(s).normalize("NFD").replace(/[゙゚]/g,"");
  const seen = new Set(); let html="";
  out.forEach(([ks,r])=>{
    [...ks].forEach(k=>{
      if(seen.has(k)) return; seen.add(k);
      const d = KANJI[k];
      if(!d){ html+=`<div class="kj"><div><div class="c">${k}</div></div><div class="r sub">아직 한자 사전에 없는 글자예요.</div></div>`; return; }
      let use="";
      if(ks.length===1){
        const ons = d.on.split("・").map(base);
        const kuns = d.kun.split("・").map(s=>s.replace(/\(.*?\)/g,""));
        const type = ons.includes(base(r)) ? "음독" : (kuns.includes(r) ? "훈독" : "특수 읽기");
        use = `<div class="r">이 단어에서: <span class="${type==="음독"?"on-t":"kun-t"}">${E(r)}</span> (${type})</div>`;
      } else use = `<div class="r">「${E(ks)}」 전체 읽기: <b>${E(r)}</b></div>`;
      html+=`<div class="kj">
        <div><div class="c">${k}</div><div class="ko">${d.ko}</div></div>
        <div>${use}
          <div class="r"><span class="on-t">음독</span> ${d.on||"-"} &nbsp; <span class="kun-t">훈독</span> ${d.kun||"-"}</div>
          <div class="tip"><b>TIP</b> ${d.tip}</div></div></div>`;
    });
  });
  return html;
}

function autoMarkup(word,yomi){
  if(!kjRe.test(word)) return word;
  const segs = word.match(new RegExp("["+KJ+"]+|[^"+KJ+"]+","g"))||[];
  let pos=0,out="";
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(kjRe.test(s[0])){
      const next=segs[i+1];
      const end = next===undefined ? yomi.length : yomi.indexOf(next,pos+1);
      if(end<0) return null;
      const r=yomi.slice(pos,end); if(!r) return null;
      out+=s+"["+r+"]"; pos=end;
    } else {
      if(yomi.substr(pos,s.length)!==s) return null;
      out+=s; pos+=s.length;
    }
  }
  return pos===yomi.length ? out : null;
}

// 예문을 문절 단위로 쪼개기 (조사·읽점·문자 종류가 바뀌는 곳)
function chunkSentence(s){
  const out=[]; let cur="";
  const isP=c=>"はがをにでともへ".includes(c), isKata=c=>/[゠-ヿ]/.test(c), isHira=c=>/[ぁ-ゖ]/.test(c);
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1], p=s[i-1]; cur+=c;
    if(!n) break;
    const prevOk = p && (kjRe.test(p) || isKata(p));
    const cut = c==="、"
      || (isP(c) && prevOk && !isP(n) && n!=="の" && !(c==="で"&&n==="す"))
      || (kjRe.test(c) && isKata(n)) || (isKata(c) && kjRe.test(n))
      || (isHira(c) && kjRe.test(n) && c!=="、" && !isP(c));
    if(cut){ out.push(cur); cur=""; }
  }
  if(cur) out.push(cur);
  return out;
}
const canOrder = w => { if(!w.ex||!w.ex[0]) return false; const n=chunkSentence(plain(w.ex[0].ja)).length; return n>=3&&n<=8; };
function mkOrd(w){
  const orig=chunkSentence(plain(w.ex[0].ja)); let idx=orig.map((_,i)=>i), t=0;
  do{ idx=shuffle(idx); }while(idx.every((v,i)=>v===i) && t++<10);
  return {chunks:idx.map(i=>orig[i]),orig,used:[],checked:false,ok:null};
}

/* 소리: 외부 파일 없이 브라우저가 직접 만드는 배경음악과 효과음이에요 (저작권 걱정 없음) */
const SND={ctx:null,timer:null,step:0,next:0};
const soundOn = () => prefs.sound!==false;
function sndInit(){
  if(!SND.ctx){
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return false;
    const c=SND.ctx=new C();
    SND.bgm=c.createGain(); SND.bgm.gain.value=.12; SND.bgm.connect(c.destination);
    SND.fx=c.createGain(); SND.fx.gain.value=.3; SND.fx.connect(c.destination);
  }
  if(SND.ctx.state==="suspended") SND.ctx.resume();
  return true;
}
const midi = m => 440*Math.pow(2,(m-69)/12);
function tone(m,t,dur,type,vol,out){
  const c=SND.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=midi(m);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.05);
}
/* 4마디(C - Am - F - G) 반복 */
const BGM_MEL=[76,79,76,72,74,76,79,0, 81,79,76,0,74,72,74,76, 77,81,77,72,74,77,81,0, 79,77,74,71,74,77,79,0];
const BGM_BASS=[48,45,41,43], BGM_ARP=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
function bgmStep(i,t){
  const bar=i>>3, k=i&7, d=60/132/2;
  if(k===0||k===4) tone(BGM_BASS[bar],t,d*3.2,"triangle",.9,SND.bgm);
  if(k%2===1) tone(BGM_ARP[bar][(k>>1)%3],t,d*1.4,"triangle",.35,SND.bgm);
  const m=BGM_MEL[i]; if(m) tone(m,t,d*1.6,"square",.22,SND.bgm);
}
function bgmStart(){
  if(!soundOn()||SND.timer||!sndInit()) return;
  SND.step=0; SND.next=SND.ctx.currentTime+.08;
  SND.timer=setInterval(()=>{
    while(SND.next<SND.ctx.currentTime+.25){ bgmStep(SND.step,SND.next); SND.step=(SND.step+1)%32; SND.next+=60/132/2; }
  },60);
}
function bgmStop(){ clearInterval(SND.timer); SND.timer=null; }
function sfx(kind){
  if(!soundOn()||!sndInit()) return; const t=SND.ctx.currentTime, o=SND.fx;
  if(kind==="ok"){ tone(84,t,.12,"sine",.9,o); tone(91,t+.07,.18,"sine",.9,o); }
  else if(kind==="ng"){ tone(45,t,.28,"sawtooth",.6,o); tone(43,t+.1,.28,"sawtooth",.6,o); }
  else if(kind==="tick"){ tone(72,t,.12,"sine",.9,o); }
  else if(kind==="go"){ tone(84,t,.14,"triangle",.9,o); tone(91,t+.09,.3,"triangle",.9,o); }
  else if(kind==="clear"){ [72,76,79,84].forEach((m,i)=>tone(m,t+i*.08,.2,"triangle",.9,o)); }
  else if(kind==="end"){ [79,76,72,67].forEach((m,i)=>tone(m,t+i*.14,.3,"triangle",.9,o)); }

function rankOf(score,type){
  const L=LADDERS[type]||LADDERS.time; let i=0; L.forEach((v,k)=>{ if(score>=v) i=k; });

/* 게임 시작 전 3-2-1 카운트다운 (끝나면 시간이 흐르기 시작해요) */
function gCountdown(rule,go){

    $("quizView").innerHTML=`<div class="qbox gbox cdbox"><div class="cdmk">${MONKEY}</div><div class="sub">준비하세요</div><div class="cdnum">${n>0?n:"시작!"}</div><p class="sub">${rule}</p><div class="qbtns"><button class="pill" data-act="gquit">취소</button></div></div>`;
    sfx(n>0?"tick":"go");
    if(n===0){ gFlash=setTimeout(()=>{ if(G&&G.type==="cd") go(); },600); return; }
    n--; gFlash=setTimeout(tick,850);

/* 짝 맞추기: 제한 시간 안에 최대한 많은 쌍을 맞혀요 (한 라운드를 끝내면 시간이 늘어나요) */
function startMatch(){
  const seen=new Set(), uniq=[];
  for(const w of shuffle(ALL.filter(inScope))){ if(w.ko && !seen.has(w.ko)){ seen.add(w.ko); uniq.push(w); } }
  if(uniq.length<6){ toast("이 범위에는 단어가 부족해요 (6개 이상 필요)"); return; }
  gCountdown("왼쪽 단어와 같은 뜻을 오른쪽에서 골라요<br>제한 시간 100초 · 틀리면 3초 줄어요",()=>beginMatch(uniq));
}
function beginMatch(uniq){
  G={type:"match",seen:new Map(),marks:new Set(),uniq,ptr:0,round:0,total:100000,end:Date.now()+100000,score:0,combo:0,pairs:0,maxc:0,wrong:new Map(),busy:false,pop:""};
  matchRound(); gTimer=setInterval(gTick,100); bgmStart();
}
function matchRound(){
  const n=G.uniq.length; G.cur=[]; for(let i=0;i<6;i++) G.cur.push(G.uniq[G.ptr++%n]);
  G.cur.forEach(w=>{ if(!G.seen.has(w.key)) G.seen.set(w.key,{w,st:"no"}); });
  G.right=shuffle(G.cur); G.done=new Set(); G.missed=new Set(); G.sel=null; G.bad=null; G.busy=false; renderMatch();
}
function renderMatch(){
  const cls=(side,w)=>G.done.has(w.key)?"good"+(G.last===w.key?" just":""):(G.bad&&G.bad[side]===w.key)?"bad":(G.sel&&G.sel.side===side&&G.sel.key===w.key)?"sel":"";
  const tile=(side,w,html)=>`<button class="opt ${cls(side,w)}" data-act="gm" data-side="${side}" data-key="${w.key}">${html}${side==="l"?`<span class="gst2 ${stars.has(w.key)?"on":""}" role="button" tabindex="-1" data-act="gmark" data-key="${w.key}" title="나중에 볼 단어로 저장" aria-label="나중에 볼 단어로 저장">${ic("star")}</span>`:""}</button>`;
  const left=Math.max(0,G.end-Date.now());
  $("quizView").innerHTML=`<div class="qbox gbox"><div class="gfx" id="gfx"></div>${mbarHTML(left)}
   <div class="gstat"><span id="gt">${Math.ceil(left/1000)}초</span><span>점수 ${G.score}</span><span>연속 ${G.combo}</span><span>라운드 ${G.round+1}</span></div>
   <p class="sub">왼쪽 단어와 같은 뜻을 오른쪽에서 골라 짝을 맞춰요. 틀리면 3초 줄고, 6쌍을 모두 맞히면 12초 늘어나요${G.pop?` <b>${G.pop}</b>`:""}</p>
   <div class="gcols"><div class="gcol">${G.cur.map(w=>tile("l",w,E(w.text)+(w.text!==w.yomi?`<small>${E(w.yomi)}</small>`:""))).join("")}</div>
   <div class="gcol">${G.right.map(w=>tile("r",w,E(w.ko))).join("")}</div></div>
   <div class="qbtns">${sndBtn()}<button class="pill" data-act="gquit">그만하기</button></div></div>`;
}
function matchPick(side,key){
  if(!G||G.type!=="match"||G.busy||G.done.has(key)) return;
  G.last=null;
  if(!G.sel||G.sel.side===side){ G.sel=(G.sel&&G.sel.side===side&&G.sel.key===key)?null:{side,key}; renderMatch(); return; }
  const lk=side==="l"?key:G.sel.key, rk=side==="r"?key:G.sel.key;
  if(lk===rk){
    const w=byKey(lk), first=!G.missed.has(lk); record(w,first); if(!first) G.wrong.set(lk,w);
    G.seen.get(lk).st=first?"ok":"ng";
    if(first){ G.score+=10+2*Math.min(G.combo,10); G.combo++; G.maxc=Math.max(G.maxc,G.combo); } else { G.score+=5; G.combo=0; }
    const pts=first?10+2*Math.min(G.combo-1,10):5;
    G.pairs++; G.done.add(lk); G.last=lk; G.sel=null; G.pop=""; sfx("ok");
    if(G.done.size===G.cur.length){
      G.busy=true; G.end+=12000; G.pop="+12초"; sfx("clear"); renderMatch();
      popFx("라운드 클리어  +12초","clr");
      const g=G; gFlash=setTimeout(()=>{ if(G!==g) return; G.round++; G.pop=""; matchRound(); },700);
    } else renderMatch();
    popFx("+"+pts,"pts"); if(first&&G.combo>=3) popFx(G.combo+" 콤보!",cmbCls(G.combo));
  } else {
    G.combo=0; G.end-=3000; G.missed.add(lk); G.missed.add(rk); [lk,rk].forEach(k=>{ const r=G.seen.get(k); if(r) r.st="ng"; }); G.bad={l:lk,r:rk}; G.busy=true; G.pop="-3초"; sfx("ng"); renderMatch(); popFx("-3초","pts neg");
    const g=G; gFlash=setTimeout(()=>{ if(G!==g) return; G.bad=null; G.sel=null; G.busy=false; G.pop=""; renderMatch(); },450);
  }
}
function endMatch(){
  sfx("end");
  const g=G, prev=getBest("match2"), isNew=g.score>0&&(prev==null||g.score>prev);
  if(isNew) setBest("match2",g.score);
  gResult({title:"짝 맞추기 결과",big:g.score+"점",score:g.score,isNew,seen:g.seen,marks:g.marks,type:"match",
    note:`시간이 끝났어요 · 맞힌 짝 ${g.pairs}쌍 · 라운드 ${g.round+1} · 최고 연속 ${g.maxc}${prev!=null&&!isNew?` · 최고 기록 ${prev}점`:""}`});
}
/* 60초 타임어택 */
function startTime(){
  const pool=ALL.filter(inScope);
  if(pool.length<4){ toast("이 범위에는 단어가 부족해요 (4개 이상 필요)"); return; }

}
function beginTime(pool){
  G={type:"time",seen:new Map(),marks:new Set(),pool:shuffle(pool),i:0,total:60000,end:Date.now()+60000,lives:3,score:0,combo:0,maxc:0,right:0,asked:0,wrong:new Map(),sel:null,q:null,lock:false};
  nextTime(); gTimer=setInterval(gTick,100); bgmStart();
}
function nextTime(){
  const w=G.pool[G.i++%G.pool.length], key=(w.text!==w.yomi&&Math.random()<.4)?"yomi":"ko";
  G.q={w,key,opts:choices(w,key)}; G.sel=null; G.lock=false; G.lostIdx=-1; renderTime();
}
function renderTime(){
  const q=G.q, w=q.w, left=Math.max(0,G.end-Date.now()), done=G.sel!==null;
  $("quizView").innerHTML=`<div class="qbox gbox"><div class="gfx" id="gfx"></div>${mbarHTML(left)}
   <div class="gstat"><span id="gt">${Math.ceil(left/1000)}초</span><span>점수 ${G.score}</span><span>연속 ${G.combo}</span>
    <span class="hp" role="img" aria-label="남은 기회 ${G.lives}번">${[0,1,2].map(i=>heart(i<G.lives,i===G.lostIdx)).join("")}</span></div>
   <div class="sub">${q.key==="ko"?"이 단어의 뜻은?":"이 단어의 읽기는?"}</div><div class="qw">${E(w.text)}</div>
   <div class="opts4">${q.opts.map((o,i)=>`<button class="opt ${done?(o===w[q.key]?"correct":i===G.sel?"wrong":""):""}" data-act="gopt" data-i="${i}" ${done?"disabled":""}><kbd>${i+1}</kbd>${E(o)}</button>`).join("")}</div>
   <div class="qbtns"><button class="pill sm" data-act="gmark" data-key="${w.key}" id="gmarkbtn">${stars.has(w.key)?"저장함에 담았어요":"나중에 볼래요"}</button>${sndBtn()}<button class="pill" data-act="gquit">그만하기</button></div></div>`;

function timePick(i){
  if(!G||G.type!=="time"||G.lock||i>=G.q.opts.length) return;
  const q=G.q, w=q.w, ok=q.opts[i]===w[q.key];
  G.sel=i; G.lock=true; G.asked++; record(w,ok); sfx(ok?"ok":"ng");

  const before=G.combo, pts=10+2*Math.min(before,10);
  if(ok){ G.right++; G.score+=pts; G.combo++; G.maxc=Math.max(G.maxc,G.combo); }
  else { G.lives--; G.lostIdx=G.lives; G.combo=0; G.wrong.set(w.key,w); }
  renderTime();
  if(ok){ popFx("+"+pts,"pts"); if(G.combo>=3) popFx(G.combo+" 콤보!",cmbCls(G.combo)); }
  else if(before>=3) popFx("연속 끊김","cmb neg");
  const g=G; gFlash=setTimeout(()=>{ if(G!==g) return; (G.lives<=0||Date.now()>=G.end) ? endTime() : nextTime(); }, ok?450:1100);

function endTime(){

}

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function buildMatchers(){
  const KR="\\u4e00-\\u9fff々";
  return ALL.map(w=>{
    const t=w.text; if(!t||t.length<2&&!kjRe.test(t)) return null;
    const hasK=kjRe.test(t);
    let pat=escRe(t);
    if(hasK && !kjRe.test(t.slice(-1)) && ["一段動詞","五段動詞","い形容詞"].includes(w.pos)){
      const stem=t.slice(0,-1);
      pat = stem.length===1 ? "(?<!["+KR+"])"+escRe(stem)+"(?!["+KR+"])" : escRe(stem);
    } else if(!hasK && t.length<3) return null;
    return {w,re:new RegExp(pat,"g")};
  }).filter(Boolean);
}
function annotate(text,ms){
  const ranges=[];
  ms.forEach(({w,re})=>{ re.lastIndex=0; let m; while((m=re.exec(text))){ if(!m[0]){re.lastIndex++;continue;} ranges.push([m.index,m.index+m[0].length,w]); } });
  ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  let pos=0,html="",hit=new Map();
  for(const [s,e,w] of ranges){
    if(s<pos) continue;
    html+=E(text.slice(pos,s))+`<mark data-key="${w.key}" title="${E(w.yomi)} · ${E(w.ko)}">${E(text.slice(s,e))}</mark>`;
    pos=e; hit.set(w.key,w);
  }
  return {html:html+E(text.slice(pos)),hit};
}

function renderNews(){

          : `<div class="empty">조건에 맞는 발표가 없어요.</div>`);
    }
  }
  $("newsView").innerHTML=`<div class="news-wrap">${newsBar()}${body}</div>`;
}

let selTimer, selInfo=null;
const hideSel = () => { $("seltool").hidden=true; };
function updateSel(){
  if(view!=="read") return hideSel();
  const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount) return hideSel();
  const rng=s.getRangeAt(0), frag=rng.cloneContents(); frag.querySelectorAll("rt").forEach(x=>x.remove());
  const t=frag.textContent.trim();
  if(!t||t.length>30||t.includes("\n")) return hideSel();
  const node=rng.commonAncestorContainer, el=node.nodeType===1?node:node.parentElement;
  if(!(el&&el.closest&&el.closest(".reader"))) return hideSel();
  const exist=ALL.find(w=>w.text===t);
  const blk=el.closest(".rja,.rtitle"); let sent="";
  if(blk){ const c=blk.cloneNode(true); c.querySelectorAll("rt").forEach(x=>x.remove()); sent=c.textContent.trim(); }
  selInfo={t,sent};
  const bar=$("seltool");
  bar.innerHTML=`<b>「${E(t)}」</b>
    <a href="https://ja.dict.naver.com/#/search?query=${encodeURIComponent(t)}" target="_blank" rel="noopener noreferrer">네이버 사전</a>
    <a href="https://jisho.org/search/${encodeURIComponent(t)}" target="_blank" rel="noopener noreferrer">Jisho</a>
    ${exist?`<button data-act="selOpen" data-key="${exist.key}">내 단어 보기</button>`:`<button data-act="selAdd">＋ 단어 추가</button>`}`;
  bar.hidden=false;
  const r=rng.getBoundingClientRect(), w=bar.offsetWidth, h=bar.offsetHeight;
  bar.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+"px";
  bar.style.top=(r.bottom+8+h>innerHeight ? Math.max(8,r.top-h-8) : r.bottom+8)+"px";
}

function renderStats(){

       <div class="dbar" style="height:${Math.round(x.n/max*100)}%" title="${x.d}: ${x.n}문제 중 ${x.c}개 정답">
         <i class="miss" style="height:${x.n?Math.round((x.n-x.c)/x.n*100):0}%"></i><i style="height:${x.n?Math.round(x.c/x.n*100):0}%"></i></div>

  const l=b.dataset.mylv; let cur=myLv().slice();
  if(l==="전체") cur=[]; else cur = cur.includes(l) ? cur.filter(x=>x!==l) : cur.concat(l);
  prefs.myLevels=cur; delete prefs.myLevel; LS.set("jp-prefs",prefs);
  lvSel=new Set(cur); level="전체"; todayOff=0; renderLevels(); renderHome();
  toast(cur.length?"내 급수: "+lvText(cur):"모든 급수로 학습해요");
});

/* ---------- 첫 실행 안내 (3단계) ---------- */
const needOnb = () => !prefs.onboarded && !Object.keys(log).length && !(prefs.myLevels&&prefs.myLevels.length);
const OB_LV=[["히라가나부터 시작해요",["N5"],"N5"],["기초는 알아요",["N5","N4"],"N5~N4"],["중급이에요",["N3","N2"],"N3~N2"],["상급이에요",["N1"],"N1"],["잘 모르겠어요",[],"전체"]];
const OB_GOAL=[[10,"가볍게","10문제 · 약 3분"],[20,"적당히","20문제 · 약 6분"],[30,"열심히","30문제 · 약 9분"]];
let obStep=0, obLv=null;
function closeOnb(){ const o=$("onb"); if(o) o.remove(); prefs.onboarded=true; LS.set("jp-prefs",prefs); }
function renderOnb(){
  let o=$("onb"); if(!o){ o=document.createElement("div"); o.id="onb"; o.setAttribute("role","dialog"); o.setAttribute("aria-label","시작 안내"); document.body.appendChild(o); }
  const dots=`<div class="obstep">${[0,1,2].map(i=>`<i class="${i<=obStep?"on":""}"></i>`).join("")}</div>`;
  if(obStep===0) o.innerHTML=`<div class="ob"><div class="obmk">${MONKEY}</div><div id="logo2" style="font-family:'Mochiy Pop One',sans-serif;font-size:30px;line-height:1.2">すらすら<span style="color:var(--accent)">日本語</span></div><h2>매일 5분,<br>술술 읽히는 일본어</h2><p class="sub">단어, 퀴즈, 뉴스를 한 곳에서 가볍게 시작해요.</p><button class="cta" data-ob="next" style="margin-top:22px">시작하기</button><button class="obskip" data-ob="skip">이미 써 본 적 있어요</button></div>`;
  else if(obStep===1) o.innerHTML=`<div class="ob">${dots}<h2>지금 일본어 실력은 어느 정도예요?</h2><p class="sub">나중에 홈에서 언제든 바꿀 수 있어요.</p><div class="obopts">${OB_LV.map((x,i)=>`<button class="mode" data-ob="lv" data-i="${i}"><b>${x[0]}</b><small>${x[2]}</small></button>`).join("")}</div></div>`;
  else o.innerHTML=`<div class="ob">${dots}<h2>하루 목표를 정해요</h2><p class="sub">부담 없이 시작하고, 익숙해지면 늘려요.</p><div class="obopts">${OB_GOAL.map(x=>`<button class="mode" data-ob="goal" data-n="${x[0]}"><b>${x[1]}</b><small>${x[2]}</small></button>`).join("")}</div></div>`;
}
function openOnb(){ obStep=0; renderOnb(); }
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ob]"); if(!b) return;
  const a=b.dataset.ob;
  if(a==="skip"){ closeOnb(); return; }
  if(a==="next"){ obStep=1; renderOnb(); return; }
  if(a==="lv"){ obLv=OB_LV[+b.dataset.i][1]; obStep=2; renderOnb(); return; }
  if(a==="goal"){
    prefs.goal=+b.dataset.n; prefs.myLevels=obLv||[]; delete prefs.myLevel;
    lvSel=new Set(prefs.myLevels); level="전체"; todayOff=0; renderLevels();
    closeOnb(); renderHome(); toast("준비 끝! 오늘 첫 학습을 시작해 볼까요?");
  }
});
if(needOnb()) openOnb();
// 프로필 (이 기기 안에서만 저장 · 비밀번호 없음)
const saveProfiles = () => RAW.set("jp-profiles",profiles);
const switchTo = id => { RAW.set("jp-active",id); location.reload(); };
function profBtn(){ $("profBtn").innerHTML=ic("user")+" "+E(curProfile().name); }
function openProf(){
  $("profDlg").innerHTML=`<div class="dh"><h2 style="margin:0">프로필</h2><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db"><p class="sub">이 기기의 브라우저 안에만 저장돼요. 프로필마다 기록 · 내 단어 · 오답 노트 · 저장함 · 내 급수가 따로 관리돼요. 비밀번호가 없어서 보안용 로그인은 아니에요.</p>
   ${profiles.map(p=>`<div class="prow">
     <button class="pill ${p.id===activeId?"on":""}" data-pa="use" data-id="${p.id}">${ic("user")} ${E(p.name)}${p.id===activeId?" (사용 중)":""}</button>
     <span><button class="pill sm" data-pa="ren" data-id="${p.id}">이름 변경</button>${profiles.length>1?` <button class="pill sm del" data-pa="del" data-id="${p.id}">삭제</button>`:""}</span></div>`).join("")}
   <form class="af" id="profAdd"><label>새 프로필 <small>닉네임 (12자까지)</small><input name="n" maxlength="12" required autocomplete="off"></label>
   <div class="qbtns"><button type="submit" class="pill on">＋ 추가하고 전환</button></div></form></div>`;
  if(!$("profDlg").open) $("profDlg").showModal();
}
$("profBtn").addEventListener("click",openProf);
$("profDlg").addEventListener("click",e=>{
  if(e.target===$("profDlg") || e.target.closest("[data-close]")) return $("profDlg").close();
  const b=e.target.closest("[data-pa]"); if(!b) return;
  const id=b.dataset.id, p=profiles.find(x=>x.id===id);
  if(b.dataset.pa==="use"){ if(id!==activeId) switchTo(id); }
  else if(b.dataset.pa==="ren"){ const n=(prompt("새 이름",p.name)||"").trim().slice(0,12); if(n){ p.name=n; saveProfiles(); profBtn(); openProf(); if(view==="home") renderHome(); } }
  else if(b.dataset.pa==="del"){
    if(!confirm("「"+p.name+"」 프로필과 그 기록을 모두 삭제할까요? 되돌릴 수 없어요.")) return;
    PER.forEach(k=>RAW.del(k+"@"+id)); profiles=profiles.filter(x=>x.id!==id); saveProfiles();
    if(id===activeId) switchTo(profiles[0].id); else openProf();
  }
});
$("profDlg").addEventListener("submit",e=>{
  e.preventDefault(); const n=(new FormData(e.target).get("n")||"").trim().slice(0,12); if(!n) return;
  const p={id:"p"+Date.now(),name:n}; profiles.push(p); saveProfiles(); switchTo(p.id);
});
profBtn();
// 화면 모드: 화이트 / 다크 / 자동
function applyTheme(){
  const m=RAW.get("jp-theme","auto"), dark=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.querySelectorAll("#theme [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===m));
}
$("theme").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(!b) return; RAW.set("jp-theme",b.dataset.t); applyTheme(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
applyTheme();
lvSel=new Set(myLv());
renderLevels(); renderGrid(); setView("home");
</script>
</body>
</html>
