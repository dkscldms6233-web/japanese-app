<style>

@font-face{font-family:"JP Kanji";src:local("HiraginoSans-W3"),local("Hiragino Sans W3"),local("HiraginoKakuGothicProN-W3"),local("Hiragino Kaku Gothic ProN W3"),local("YuGothic-Regular"),local("Yu Gothic Regular"),local("YuGothicUI-Regular"),local("Meiryo"),local("NotoSansJP-Regular"),local("Noto Sans JP Regular"),local("NotoSansCJKjp-Regular"),local("Noto Sans CJK JP Regular"),local("SourceHanSansJP-Regular");unicode-range:U+3040-30FF,U+31F0-31FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF66-FF9F}
:root{
  --bg:#f7f7f5; --card:#ffffff; --text:#1d2226; --sub:#636a72; --line:#e3e4e1;
  --accent:#2f4a73; --accent-dk:#1f3555; --accent-soft:#e7edf6; --chip:#eeefec; --onacc:#fff; --seal:#b0463a; --sakura:#d9879e; --kin:#b08d4f;
  --on:#1f5fb0; --kun:#237a46; --lvfg:#fff;
  --n5:#2e8b57; --n4:#2a7fc4; --n3:#b07d00; --n2:#d9631e; --n1:#c62f3f; --nx:#6b6b73;
  --pn:#2a6fb5; --pv:#237a46; --pa:#8a3fb0;
}
:root{color-scheme:light; --g1:#edf1f8; --g2:#f6f7f8; --gold:#e6a100;}
:root[data-theme=dark]{ color-scheme:dark; --g1:#2a1f17; --g2:#201813; --gold:#f2c14e;
  --bg:#17120e; --card:#211a15; --text:#f5f2ec; --sub:#b7aa99; --line:#35291f;
  --accent:#ecdec4; --accent-dk:#d3c3a2; --accent-soft:#31261c; --chip:#2b2119; --onacc:#1b140d; --seal:#e08b7e; --sakura:#e8a1b5; --kin:#d1b077;
  --on:#8ab8f5; --kun:#7fd8a2; --lvfg:#111;
  --n5:#55c98a; --n4:#62b0f0; --n3:#e8b83c; --n2:#f08a4b; --n1:#ff7080; --nx:#9a9aa4;
  --pn:#8ab8f5; --pv:#7fd8a2; --pa:#d3a3ee; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:16px;
  font-family:"JP Kanji","Noto Sans JP",-apple-system,"Hiragino Sans","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- 헤더 / 탭 ---- */
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 8px}
@media(min-width:700px){header{position:sticky;top:0;z-index:5}}
.hin{max-width:960px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
h1{margin:0;font-size:22px}
h1 span{color:var(--accent)}
#logo{display:flex;flex-direction:column;line-height:1.05}
#logo .lgm{font-family:"Mochiy Pop One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:400;font-size:25px;letter-spacing:.03em;text-shadow:2px 2px 0 var(--accent-soft)}
#logo small{align-self:flex-start;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:10.5px;line-height:1;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px 3px 10px;margin-top:5px}
.views{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.vb{border:none;background:none;color:var(--sub);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600;display:flex;gap:6px;align-items:center}
.vb.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.vb i{font-style:normal}
@media(max-width:699px){
  body{padding-bottom:76px}
  .views{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:var(--card);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .vb{flex-direction:column;gap:0;font-size:12px;padding:6px 0;border-radius:8px}
  .vb i{font-size:20px}
  .vb.on{box-shadow:none;color:var(--accent);background:var(--accent-soft)}
}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
.pill.on{background:var(--accent);border-color:var(--accent);border-bottom:3px solid var(--accent-dk);color:var(--onacc)}
.pill.add{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.pill:disabled{opacity:.4;cursor:default}
.pill.sm{padding:2px 10px;font-size:13px;font-weight:600}
.opts{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;margin:6px 0 2px}
label.tg{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
select,textarea,.af input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:15px}
[data-view=quiz] .list-only,[data-view=exam] .list-only,[data-view=game] .list-only{display:none}
[data-view=quiz] .levels,[data-view=quiz] .opts,[data-view=exam] .levels,[data-view=exam] .opts,[data-view=game] .levels,[data-view=game] .opts{display:none}
[data-view=list][data-stage=pick] :is(.list-only,.levels,.opts){display:none}
.pick{max-width:820px;margin:10px auto}
.pick h2{margin:6px 0 2px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
@media(min-width:700px){.pkgrid.five{grid-template-columns:repeat(5,1fr)}.pkgrid.four{grid-template-columns:repeat(5,1fr)}}
.pk{position:relative;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:18px 14px 14px;text-align:left;cursor:pointer;font:inherit;transition:transform .12s,border-color .12s}
.pk::before{content:"";position:absolute;left:14px;top:0;width:34px;height:5px;border-radius:0 0 4px 4px;background:var(--lvc,var(--accent))}
.pk:hover{border-color:var(--accent);transform:translateY(-2px)}
.pk b{display:block;font-size:26px;line-height:1.2}
.pk small{display:block;color:var(--sub);margin-top:2px;font-size:13px}
.pk em{display:block;font-style:normal;font-size:13px;margin-top:6px;color:var(--text)}
.pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.pkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:6px}
.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.pbar select{max-width:100%;flex:1;min-width:150px}
.pg{justify-content:center}
[data-view=news] :is(.list-only,.levels,.opts),[data-view=anime] :is(.list-only,.levels,.opts),[data-view=community] :is(.list-only,.levels,.opts),[data-view=stats] :is(.list-only,.levels,.opts),
[data-view=grammar] :is(.list-only,.levels,.opts),[data-view=plus] :is(.list-only,.levels,.opts),[data-view=home] :is(.list-only,.levels,.opts),[data-view=today] :is(.list-only,.levels,.opts),[data-view=read] :is(.list-only,.levels,.opts){display:none}

main{max-width:960px;margin:0 auto;padding:12px 16px 40px}
.count{font-size:14px;color:var(--sub);margin:2px 0 10px}
.sub{color:var(--sub);font-size:14px}
/* 개발자 모드로 로그인한 사람에게만 보이는 설명 */
#profDlg .pfdb{text-align:center}
#profDlg .pfbird{width:150px;height:150px;margin:2px auto 8px;border-radius:30px;border-width:4px}
#profDlg .pfbird svg{width:100%;height:auto;display:block}
#profDlg .pfchips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
#profDlg .pfchips span{background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--sub)}
#profDlg .pfchips b{color:var(--text)}
#profDlg .pftt{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 10px}#profDlg .pftt small{color:var(--sub);font-size:13px}#profDlg .pftt select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--card);color:var(--text)}
#profDlg .pfxp{max-width:260px;margin:0 auto 12px}#profDlg .pfxp small{display:block;margin-top:4px;color:var(--sub);font-size:12px}
#profDlg .pfname{margin:4px 0 14px;display:flex;flex-direction:column;gap:2px}#profDlg .pfname b{font-size:20px}
#profDlg .pfbtns{display:flex;gap:8px}#profDlg .pfbtns .pill{flex:1;justify-content:center;padding:9px 8px;font-size:14px}#profDlg .pfbtns .pill:not(.on){flex:.8;font-size:13px;color:var(--sub)}
#profDlg .qbtns{display:flex!important;gap:8px!important;margin:12px 0 0!important}#profDlg .qbtns{justify-content:stretch!important;margin:8px 0 0!important}#profDlg .qbtns .pill{flex:1;justify-content:center;text-align:center;padding:7px 8px;font-size:13px}#profDlg .qbtns .pill:last-child{flex:.8}
#profDlg .pfout{display:block;margin:14px auto 0;background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.devonly{display:none!important}body.dev-on .devonly{display:revert!important}
.empty{text-align:center;color:var(--sub);padding:40px 0}

/* ---- 급수 뱃지 / 품사 태그 ---- */
.lvb{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:6px;color:var(--lvfg);background:var(--nx);line-height:1.6;vertical-align:middle}
.lv-N5{background:var(--n5)}.lv-N4{background:var(--n4)}.lv-N3{background:var(--n3)}.lv-N2{background:var(--n2)}.lv-N1{background:var(--n1)}
.lc-N5{--lc:var(--n5)}.lc-N4{--lc:var(--n4)}.lc-N3{--lc:var(--n3)}.lc-N2{--lc:var(--n2)}.lc-N1{--lc:var(--n1)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--sub)}
.tag.pn{--c:var(--pn)}.tag.pv{--c:var(--pv)}.tag.pa{--c:var(--pa)}
.tag.pn,.tag.pv,.tag.pa{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}

/* ---- 단어 카드 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lc,var(--nx));border-radius:14px;padding:12px 14px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ctop{display:flex;justify-content:space-between;align-items:center}
.card .w{font-size:34px;line-height:1.9;margin-top:2px}
.card .m{font-size:17px;font-weight:600;margin-bottom:6px}
.star{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);padding:0 4px;line-height:1}
.star.on{color:#e0a800}
.hide .card .m{filter:blur(8px);transition:filter .15s}
.hide .card:hover .m{filter:none}
rt{font-size:.52em;color:var(--sub)}
.nofuri rt{visibility:hidden}
.nofuri ruby:hover rt,.nofuri ruby.fshow rt{visibility:visible}.nofuri ruby.fshow rt{color:var(--accent)}

/* ---- 상세 화면 ---- */
dialog{width:min(680px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 0}
.dh .big{font-size:48px;line-height:1.8}
.dtools{display:flex;gap:6px}
.x{border:none;background:var(--chip);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:17px}
.x.starb.on{color:#e0a800}
.db{padding:0 20px 20px}
.mean{font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.posbox{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.posbox b{color:var(--accent)}
h3{font-size:15px;margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.note{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.kj{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.kj .c{font-size:44px;line-height:1.2;text-align:center}
.kj .ko{font-size:13px;color:var(--sub);text-align:center}
.r{font-size:14px}
.on-t{color:var(--on);font-weight:700}
.kun-t{color:var(--kun);font-weight:700}
.tip{font-size:14px;margin-top:4px;background:var(--chip);border-radius:8px;padding:4px 10px}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:16px}
.rel small{display:block;color:var(--sub);font-size:12px}
.rel .lnk{cursor:pointer}
.ex{background:var(--chip);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.ex .ja{font-size:19px;line-height:2.1}
.ex .ko{font-size:14px;color:var(--sub)}
.dnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
.dnav .del{color:#c0392b;border-color:#c0392b}

/* ---- 단어 추가 폼 ---- */
.af label{display:block;margin:12px 0 0;font-size:14px;font-weight:600}
.af label small{font-weight:400;color:var(--sub);margin-left:4px}
.af input,.af select,.af textarea{width:100%;margin-top:4px;display:block}
.af .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- 퀴즈 ---- */
.qbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.qbox{max-width:620px;margin:16px auto;text-align:center}
.qbox h2{margin:8px 0}
.modes{display:grid;gap:10px;margin:16px 0}
.mode{border:1.5px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--text);border-radius:14px;padding:16px;cursor:pointer;text-align:left;font-size:15px}
.mode:hover{border-color:var(--accent)}
.mode b{display:block;font-size:17px}
.mode small{color:var(--sub)}
.prog{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:4px 0 6px}
.prog div{height:100%;background:var(--accent);transition:width .2s}
.qw{font-size:54px;margin:24px 0 12px;line-height:1.8}
.qw.s{font-size:30px;margin:10px 0 2px}
.qm{font-size:22px;font-weight:700;margin-bottom:6px}
.opts4{display:grid;gap:8px;margin-top:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:13px 14px;font-size:18px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{color:var(--text);cursor:default}
.opt.correct{background:#d8f0e0;border-color:#2e7d4f;color:#12361f}
.opt.wrong{background:#f8d7d3;border-color:#c0392b;color:#4a1511}
kbd{display:inline-block;min-width:20px;text-align:center;font-size:12px;background:var(--chip);color:var(--sub);border-radius:5px;margin-right:8px;padding:0 4px}
.reveal{margin-top:14px;padding:10px;border-radius:12px;background:var(--chip)}
.score{font-size:52px;font-weight:800;color:var(--accent);margin:12px 0}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;margin:14px 0 10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ans.ok{border-color:#2e7d4f;background:#d8f0e022}
.ans.ng{border-color:#c0392b;background:#f8d7d322}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ck{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 14px;font-size:20px;cursor:pointer}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.gcol{display:grid;gap:8px;align-content:start}
.gcols .opt{text-align:center;font-size:17px;padding:10px 8px;min-height:54px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.3}
.gcol{grid-auto-rows:76px}.gcols .opt{height:76px!important;min-height:76px!important;padding:6px 8px!important;overflow:hidden;box-sizing:border-box;line-height:1.25}
.gcols .opt small{font-size:13px!important;margin-top:2px}
.gcols .opt small{font-size:12px;color:var(--sub);font-weight:500}
.gcols .opt{position:relative}
.gcols .opt.good{cursor:default}
.gcols .gst2{position:absolute;top:2px;right:2px;padding:2px;line-height:0;color:var(--sub);opacity:.55;cursor:pointer;background:none;border:none}
.gcols .gst2 .ic{width:20px;height:20px}
.gcols .gst2.on{color:#e0a800;opacity:1}
.gcols .gst2.on .ic{fill:currentColor}
.glist{text-align:left;margin:6px 0 4px}
.grow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:6px 0;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.grow .gw{font-size:20px;min-width:88px}
.grow .gk{flex:1;color:var(--sub);font-size:15px}
.grow .star{flex:none}
.gtag{display:inline-block;font-size:11px;line-height:1;padding:3px 7px;border-radius:999px;margin-right:4px;white-space:nowrap}
.gtag.ng{background:#f8d7d3;color:#4a1511}
.gtag.ok{background:#d8f0e0;color:#12361f}
.gtag.no{background:var(--chip);color:var(--sub)}
.gtag.q{background:var(--accent-soft);color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.opt.good{background:#d8f0e0;border-color:#2e7d4f;color:#12361f;opacity:.4}
.opt.good small{color:#12361f}
.opt.bad{background:#f8d7d3;border-color:#c0392b;color:#4a1511;animation:gshake .3s}
@keyframes gshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gstat{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin:2px 2px 6px}
.hp{display:inline-flex;gap:4px}
.hp i{width:12px;height:12px;border-radius:50%;background:#c0392b}
.hp i.off{background:var(--chip)}
.newbest{display:inline-block;background:var(--accent);color:var(--onacc);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}

.mascot{display:block;width:100%;height:100%;object-fit:contain}
.hmk .mascot,.obmk .mascot,.rmk .mascot,.gi .mascot{width:100%;height:100%}
.cdmk .mascot{width:72px;height:72px;transform-origin:50% 100%;animation:gmhop .55s ease-in-out infinite}
.monk .mascot{width:46px;height:46px;transform-origin:50% 100%;animation:gmhop .55s ease-in-out infinite}
.monk.fast .mascot{animation-duration:.3s}
.gc .gi .mascot{width:40px;height:40px}
:root[data-theme=dark] .mascot{filter:none;background:radial-gradient(circle at 50% 40%,#fcfbf6,#e5e4dc);border-radius:50%;padding:13%;box-sizing:border-box;box-shadow:0 0 18px rgba(255,255,255,.10)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:560px){.kj{grid-template-columns:48px 1fr}.dh .big{font-size:38px}.qw{font-size:44px}.card .w{font-size:30px}}
.jscript{margin:14px 0;padding:12px 14px;border:1px solid var(--line,#ccc);border-radius:10px;text-align:left;font-size:15px;line-height:1.9}.jscript>b{display:block;font-size:12px;opacity:.6;margin-bottom:4px}.jwho{display:inline-block;min-width:1.6em;text-align:center;font-size:12px;border-radius:6px;background:rgba(0,0,0,.08);margin-right:4px}.jcredit{margin:26px 0 4px;text-align:center;font-size:11px;opacity:.38}/* 폰 화면 보강: iOS에서 입력칸을 누르면 화면이 확대되는 문제(16px 미만 글자), 손가락으로 누른 뒤 카드가 들뜬 채 남는 문제(:hover), 가로로 밀리는 문제 */
html,body{overflow-x:clip;max-width:100%}
img,svg,video{max-width:100%}
@media(max-width:699px){input,select,textarea,.af input{font-size:16px!important}}
@media(hover:none){.pk:hover,.card:hover,.gcard:hover,.ncard:hover,.tile:hover,.wcard:hover,.mode:hover,.back:hover,.t2:hover,.gbox .opt:hover:not(:disabled){transform:none;box-shadow:none;border-color:inherit}.card:hover{box-shadow:none}}
@media(max-width:600px){.card .w.wl{font-size:15px!important;line-height:2!important}}
.say{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 4px;display:inline-flex;align-items:center;line-height:1}
.say .ic{width:17px;height:17px}.say.sm .ic{width:15px;height:15px}.say.x{width:34px;height:34px;justify-content:center;border-radius:50%;background:var(--chip)}
.cbtns{display:inline-flex;align-items:center;gap:2px}
.kentry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:18px;padding:14px 16px;margin:10px 0;font:inherit;color:var(--text);cursor:pointer}
.kentry .kg{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:700;line-height:1}
.kentry .kg small{font-size:15px;font-weight:500;opacity:.85;margin-top:2px}
.kentry .kt{flex:1;min-width:0}.kentry .kt b{display:block;font-size:17px;margin-bottom:3px}.kentry .kt small{display:block;font-size:13px;line-height:1.45;color:var(--sub)}
.kentry .ka{flex:none;font-size:26px;color:var(--accent)}
body.kanamode .levels,body.kanamode .opts{display:none}
.kentry .kt small{word-break:keep-all}
.hsent{flex:1;min-width:0;display:block;text-align:left;border:0;background:transparent;padding:0;color:var(--text);font:inherit;cursor:pointer}
.hsent .lab{display:block;font-size:12px;color:var(--accent);font-weight:700;margin-bottom:2px}
.hsent .ja{display:block;font-size:20px;line-height:1.9;font-weight:600;letter-spacing:-.01em}
.hsent .ko{display:block;font-size:13.5px;color:var(--sub);line-height:1.45;margin-top:1px}
.lvrow{display:flex;align-items:center;gap:10px;margin:6px 0 14px}.lvrow>span{font-weight:700;font-size:14px;flex:none}.lvrow .jlv{flex:1;margin:0}
.bgmbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:12px 0 4px}
.bgmbar .bgml{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--sub);flex:none}
.bgmbar .bgml .ic{width:16px;height:16px}
.bgmname{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}.bgmname b{font-size:15px;white-space:nowrap}
.bgmdots{display:flex;gap:5px}.bgmdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.bgmdots i.on{width:16px;border-radius:4px;background:var(--accent)}
.bgmbar .pill{flex:none;white-space:nowrap}

/* ================= 테마: 담백한 미니멀 (박스·그림자를 줄이고 여백·글자 위계·가는 선으로 구분. 포인트 색은 하나) ================= */
:root{
  --bg:#ffffff; --card:#ffffff; --text:#1f2430; --sub:#6b7280; --line:#e9ecf1;
  --accent:#e4694c; --accent-dk:#cf5538; --accent-text:#c9522f; --accent-soft:#fff0ea; --chip:#f4f6f9; --onacc:#ffffff;
  --blue:#4a8fc2; --blue-dk:#3b7aab; --blue-soft:#eaf3fa;
  --ok:#3fa98a; --ok-dk:#2f8e72; --ok-soft:#e4f4ee; --bad:#d9546a; --bad-soft:#fbe9ec;
  --seal:#d9483f; --sakura:#e58aa6; --kin:#d9a43a; --gold:#d9a43a; --g1:#fcece6; --g2:#f7f4ef;
  --on:#3b7aab; --kun:#2f8e72;
  --n5:#4a8fc2; --n4:#7a62c8; --n3:#d9a43a; --n2:#e4694c; --n1:#4b5368;
  --sh:none; --sh2:none;
  --fo1:#d5ebd7; --fo2:#b1d9b9; --fo3:#8cc8a0; --fo-trunk:#c9a27c; --fo-path:#f3e6cf;
}
:root[data-theme=dark]{
  --bg:#000000; --card:#101010; --text:#f4f2ee; --sub:#a3a09a; --line:#2a2a2a;
  --accent:#ff8a6b; --accent-dk:#ee7455; --accent-text:#ff9d82; --accent-soft:#2e1f1a; --chip:#1c1c1c; --onacc:#2a1510;
  --blue:#7db8e0; --blue-dk:#7db8e0; --blue-soft:#1f3140;
  --ok:#64cfae; --ok-dk:#4fb596; --ok-soft:#1d3a30; --bad:#ff8196; --bad-soft:#42232a;
  --seal:#ff7d73; --sakura:#f0a3bb; --kin:#e6bd5c; --gold:#e6bd5c; --g1:#1c1c1c; --g2:#101010;
  --on:#7db8e0; --kun:#64cfae;
  --n5:#7db8e0; --n4:#a894e8; --n3:#e6bd5c; --n2:#ff8a6b; --n1:#9aa3bd;
  --fo1:#27392d; --fo2:#30503c; --fo3:#3a6a4b; --fo-trunk:#6e5542; --fo-path:#3f3529;
}
h2,h3,.cta,.pill,.mode b,.pk b,.vb{font-weight:700}
header{border-bottom:1px solid var(--line);box-shadow:none}
#logo small,.puh .pun{color:var(--accent-text)}
/* 박스 줄이기: 카드는 가는 선만 */
.mode,.pk,.card,.pstat,.pu,.an-card,.an-hero,.panel,.tbox{border:1px solid var(--line);border-radius:14px;box-shadow:none;background:var(--card)}
.card{border-left:4px solid var(--lc,var(--nx))}
.mode:hover,.pk:hover{background:var(--chip);transform:none}
.pk.sel{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent) inset}
/* 버튼 */
.cta{border:0;border-radius:14px;box-shadow:none;font-weight:700;letter-spacing:0;padding:15px 12px}
.cta:active{transform:scale(.98);border-bottom-width:0}
.cta.sec{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:600}
.cta.sec:hover{background:var(--chip)}
.cta.sec:active{border-bottom-width:1px}
.pill{border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--onacc);box-shadow:none}
.opt{border:1px solid var(--line);border-radius:14px;font-weight:600;background:var(--card);box-shadow:none}
.opt:hover:not(:disabled){border-color:var(--text);background:var(--card)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);color:#1f6e57}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:#b43a50}
:root[data-theme=dark] .opt.correct{color:#8fe9cb}:root[data-theme=dark] .opt.wrong{color:#ff9fb0}
.prog{height:6px;border-radius:3px;background:var(--chip)}
.prog div{border-radius:3px;background:var(--accent)}
.prog div::after{display:none}
/* 하단 탭: 화면에 붙은 평평한 바 */
.vb.on{color:var(--accent-text)}
@media(max-width:699px){
  body{padding-bottom:70px}
  .views{left:0;right:0;bottom:0;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--bg);box-shadow:none;padding:4px 2px calc(4px + env(safe-area-inset-bottom));grid-template-columns:repeat(6,1fr)}
  .vb{border-radius:0;font-size:11px;font-weight:600}
  .vb i{font-size:19px}
  .vb.on{background:none;color:var(--accent-text);outline:0}
}
/* 퀴즈 결과 패널 */
.inq .reveal{border-top:1px solid var(--line);box-shadow:none}
.inq .reveal.ok{background:var(--ok-soft);color:#1f6e57}
.inq .reveal.ng{background:var(--bad-soft);color:#b43a50}
.inq .reveal .cta{background:var(--accent)}
.inq .reveal.ok .cta{background:var(--ok);box-shadow:none}
.inq .reveal.ng .cta{background:var(--bad);box-shadow:none}
:root[data-theme=dark] .inq .reveal.ok{color:#8fe9cb}:root[data-theme=dark] .inq .reveal.ng{color:#ff9fb0}
/* 홈의 목록형 메뉴 */
.lrows{margin:6px 0 14px;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;font-size:16px;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
.lrow i{font-style:normal;color:var(--sub);font-size:20px}
.lrow:hover{background:var(--chip)}
.t2,.gcard,.ncard,.tile,.wcard,.klesson,.kcta,.prow{border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:none!important}
.t2:active,.gcard:active,.ncard:active,.tile:active{transform:scale(.99)}
.t2:hover,.gcard:hover,.ncard:hover,.tile:hover{border-color:var(--text)!important;background:var(--card)}
.t2 .ti,.t2.c1 .ti,.t2.c2 .ti,.t2.c3 .ti,.t2.c4 .ti{background:var(--accent-soft)!important;color:var(--accent-text)!important;border-radius:10px}
/* 색을 다양하게: 칸마다 다른 파스텔 */
.pkgrid{grid-template-columns:1fr!important;gap:0!important;border-top:1px solid var(--line)}
.pk{display:flex!important;align-items:center;gap:14px;padding:14px 4px 14px 14px!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:none!important;box-shadow:none!important}
.pk::before{left:0!important;top:50%!important;width:4px!important;height:30px!important;border-radius:2px!important;transform:translateY(-50%)}
.pk b{font-size:22px!important;min-width:64px}
.pk small{flex:1;margin:0!important}
.pk em{margin:0!important;font-size:12px!important;color:var(--sub)!important;text-align:right}
.pk:hover{background:var(--chip)!important}
.gcards{gap:0!important;border-top:1px solid var(--line)}
.gc{border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:none!important;box-shadow:none!important;padding:14px 2px!important;margin:0!important}
.gc .gi{display:none!important}
.gc:hover{background:var(--chip)!important}
.hanko{border-color:var(--seal)}
/* ---- 헤더 정리: 홈이 아닌 화면은 한 줄로, 테마 전환은 버튼 하나로 ---- */
.theme{display:none}
body:not([data-view=home]) header .hin::before{display:none}
body:not([data-view=home]) header{padding:8px 16px 6px}
body:not([data-view=home]) .top{flex-wrap:nowrap;margin-bottom:4px}
body:not([data-view=home]) #logo small{display:none}
/* ---- 하단 탭 5개 · 탭 안 전환 스위치 ---- */
.subtabs{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:999px;margin:10px auto 6px;width:max-content;max-width:100%}
.subtabs[hidden]{display:none}
.subtabs button{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;font-weight:700;padding:6px 18px;border-radius:999px;cursor:pointer}
.subtabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
body.inq .subtabs,body.inr .subtabs,body:has(#quizView .gbox) .subtabs{display:none}
/* ---- 주간 리포트 · 복귀 안내 ---- */
.rpt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.rpt>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.rpt b{display:block;font-size:24px}.rpt b small{font-size:13px;font-weight:600;margin-left:2px}.rpt span{font-size:12px;color:var(--sub)}
.rptn{margin:10px 0 0;line-height:1.55}.hback{margin:0 0 10px;padding:0;background:none;color:var(--accent-text);font-size:14px;line-height:1.5}
/* ===== 디자인 정리: 화면마다 성격에 맞는 모양 · 색은 먹/종이/인주 · 모서리는 작게 ===== */
:root{--rad:12px}
/* 공통: 모서리 · 그림자 · 불필요한 움직임 */
.t2,.gcard,.ncard,.tile,.klesson,.kcta,.prow,.panel,.kpi,.rpt>div,.rvsum>div,.hgoal,.pstat,.jr,.qset,.lrows,article.news,.tbox,.qbox .gc,.mylvbox{border-radius:var(--rad)!important}
.card:hover,.t2:hover,.ncard:hover,.tile:hover{transform:none!important;box-shadow:none!important}
.t2:active{transform:none!important;border-bottom-width:1.5px!important}
/* 페이지 제목: 서점 장부처럼 먹선 하나 */
.qm-h,#statsView h2,.grwrap>h2{padding-bottom:6px;border-bottom:2px solid var(--text);margin-bottom:10px}
.qm-h h2,#statsView h2,.grwrap>h2{font-size:22px;letter-spacing:-.01em}
.qm-sec{font-size:13px;color:var(--sub);text-transform:none;letter-spacing:.02em;margin:16px 0 4px}
.qm-sec .ic{display:none}
.qm-sec small{font-weight:500}
/* 퀴즈·모의시험 = 시험지: 번호 붙은 문항 목록 */
.tiles2{display:block!important;margin:6px 0;counter-reset:q}
.tiles2 .t2{display:flex!important;flex-direction:row!important;align-items:baseline!important;gap:4px 10px;flex-wrap:wrap;width:100%;box-sizing:border-box;background:transparent!important;border:0!important;border-bottom:1px dashed var(--line)!important;border-radius:0!important;padding:14px 4px!important;min-height:0!important}
.tiles2 .t2::before{counter-increment:q;content:counter(q) ".";font-weight:800;color:var(--accent-text);min-width:1.4em}
.tiles2 .t2 .ti{display:none!important}
.tiles2 .t2 b{font-size:17px}
.tiles2 .t2 small{flex-basis:100%;padding-left:calc(1.4em + 10px);font-size:12.5px}
.tiles2 .t2:hover{background:var(--accent-soft)!important}
/* 학습 리포트 = 대시보드: 아이콘 없이 숫자 중심 */
.kpi .ki{display:none!important}
.kpis{gap:0!important;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;grid-template-columns:repeat(2,1fr)!important}
.kpi{border:0!important;border-radius:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;padding:12px 14px!important;background:transparent!important}
.kpi b,.rpt b{font-variant-numeric:tabular-nums}
.kpi span{font-size:12px!important;letter-spacing:.02em}
.panel h3,.wk h3{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.03em;margin-bottom:8px}
.rpt{gap:0!important;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden}.rpt>div{border:0!important;border-radius:0!important;border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}
.qset summary .ic{display:none}
/* ---- 게임 탭: 게임 포스터 타일 ---- */
.gbanner{display:flex;align-items:center;justify-content:space-between;background:#3f8f5f;color:#fff;border-radius:var(--rad);padding:14px 18px 0;margin:2px 0 12px;overflow:hidden;position:relative;min-height:84px}
.gbanner b{display:block;font-size:26px;letter-spacing:-.01em}.gbanner span{font-size:14px;opacity:.9}
.gbanner img{height:82px;width:auto;margin-bottom:-6px}
.gbanner::before{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:#2f7a4c}
.gcards{display:grid!important;grid-template-columns:1fr 1fr;gap:10px!important;border-top:0!important}
.gc{display:flex!important;flex-direction:column;align-items:stretch!important;gap:0!important;padding:0!important;border:2px solid #3b342f!important;border-bottom-width:5px!important;border-radius:var(--rad)!important;overflow:hidden;background:var(--card)!important;text-align:left}
.gc:active{transform:translateY(2px)!important;border-bottom-width:3px!important}
.gc .gi{display:flex!important;width:100%!important;height:auto!important;border-radius:0!important;padding:14px 8px 10px;box-sizing:border-box;border-bottom:2px solid #3b342f}
.gc .gi svg{width:100%!important;height:auto!important}
.g-match .gi{background:#cfe9d6}.g-wordle .gi{background:#ffe6a8}.g-shiri .gi{background:#cfe3f3}.g-fall .gi{background:#f6d3c4}
.gc .gt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.gc .gt b{font-size:17px}
.gc:hover{background:var(--card)!important}
/* ---- 단어장 위쪽 정리: 한 줄씩, 가로로 밀어서 보기 · 켜고 끄는 항목은 칩 ---- */
.levels{flex-wrap:nowrap!important;overflow-x:auto;gap:6px!important;margin:8px 0 6px!important;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.levels::-webkit-scrollbar{display:none}
.levels .pill{flex:none;padding:6px 13px!important;font-size:14px!important}
.opts{flex-wrap:nowrap!important;overflow-x:auto;gap:8px!important;margin:4px 0 8px!important;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opts select{flex:none;font-size:13px;padding:6px 10px;height:auto;border-radius:999px}
.opts label.tg{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--sub);white-space:nowrap}
.opts label.tg input{display:none}
.opts label.tg:has(input:checked){background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent);font-weight:700}
.bar.list-only{margin-bottom:0}
/* ===== 벤치마킹 패스(듀오링고·말해보카·클래스카드의 좋은 점을 우리 색으로): 도톰한 버튼 · 학습 완료 화면 · 암기 현황 ===== */
.cta{border-bottom:4px solid var(--accent-dk)!important;border-radius:14px!important;font-weight:800!important}
.cta:active{transform:translateY(2px)!important;border-bottom-width:2px!important}
.cta.sec{border:1.5px solid var(--line)!important;border-bottom:4px solid var(--line)!important;font-weight:700!important}
.cta.sec:active{border-bottom-width:2px!important}
.cta:disabled{border-bottom-width:4px}
.inq .reveal.ok .cta{border-bottom-color:var(--ok-dk,#2a8a6f)!important}
.inq .reveal.ng .cta{border-bottom-color:#b8324d!important}
.rst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 8px}
.rt{border:2px solid var(--c,var(--line));border-radius:12px;overflow:hidden;text-align:center;background:var(--card)}
.rt b{display:block;font-size:22px;padding:10px 4px 6px;color:var(--c)}
.rt span{display:block;font-size:12px;padding:4px 2px 6px;background:var(--c);color:#fff;font-weight:700}
.rt.rxp{--c:#e89a14}.rt.racc{--c:var(--ok,#3fa98a)}.rt.rtime{--c:var(--blue,#4a8fc2)}
.pk{flex-wrap:wrap}
.pk .pgb{flex-basis:100%;height:8px;border-radius:3px;background:var(--chip);display:flex;overflow:hidden;margin-top:8px}
.pk .pgb .pm{background:var(--ok,#3fa98a)}.pk .pgb .pl{background:#e89a14}
.pk .pgt{flex-basis:100%;font-size:12px;color:var(--sub);margin-top:4px;text-align:left}
.wst{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:2px;background:var(--line)}
.wst.s1{background:#e89a14}.wst.s2{background:var(--ok,#3fa98a)}
/* ---- 단어 카드(암기): 큰 카드 · 알아요/몰라요 · 밀어서 넘기기 ---- */
.fcs{display:flex;gap:8px;justify-content:center;margin:8px 0 12px}
.fk,.fu{font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px}
.fk{background:var(--ok-soft,#e4f4ee);color:var(--ok-dk,#2f8e72)}.fu{background:var(--bad-soft,#fbe9ec);color:#b43a50}
.fcard{width:100%;min-height:300px;border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 16px;font:inherit;color:var(--text);text-align:center;cursor:pointer;touch-action:pan-y}
.fcard.back{border-color:var(--accent);cursor:default}
.fw0{font-size:52px;line-height:1.6;font-weight:700}.fw1{font-size:44px;line-height:1.7;font-weight:700}
.fm{font-size:24px;font-weight:800}.fhint,.ftap{font-size:13px;color:var(--sub)}
.fex{text-align:left;font-size:16px;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;width:100%;line-height:1.9}.fex small{display:block;color:var(--sub);font-size:14px;line-height:1.5}
.fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fno{color:#b43a50!important;border-color:#e3b3ad!important;border-bottom-color:#e3b3ad!important}
.fyes{background:var(--ok)!important;border-bottom-color:var(--ok-dk,#2f8e72)!important}
/* ---- 오늘의 퀘스트: 원형 진행 · 퀘스트마다 보상 · 보물상자 ---- */
.quest{margin:8px 0 16px;padding:14px 14px 12px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--card)}
.qh{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 6px;padding:0;border:0;background:none;color:var(--text);font:inherit;cursor:pointer;text-align:left}.qh b{font-size:17px;font-weight:800;flex:1}
.qchev{width:10px;height:10px;border-right:3px solid var(--sub);border-bottom:3px solid var(--sub);transform:rotate(45deg) translateY(-3px);transition:transform .15s;flex:none;margin:0 4px 0 2px}
.quest.shut .qchev{transform:rotate(-45deg)}
.quest.shut .qbody{display:none}
.quest.shut{padding-bottom:12px}
.quest.shut .qh{margin-bottom:0}
.qcnt{font-size:13px;font-weight:800;color:#b36b00;background:#fff1d1;border-radius:999px;padding:2px 11px}
.qrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
button.qrow{width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.qrow:active{background:var(--chip)}
.qring{width:44px;height:44px;flex:none}.qtr{fill:none;stroke:var(--chip);stroke-width:5}.qfg{fill:none;stroke:#e89a14;stroke-width:5;stroke-linecap:round}
.qring.dn .qfg{stroke:var(--ok,#3fa98a)}.qck{fill:none;stroke:var(--ok,#3fa98a);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.qn{font-size:15px;font-weight:800;fill:var(--text)}
.qm{flex:1;min-width:0}.qm b{display:block;font-size:15px;font-weight:700}.qm small{font-size:12.5px;color:var(--sub);font-weight:600}
.qrow.dn .qm b{color:var(--sub)}
.qxp{font-size:12.5px;font-weight:800;color:#b36b00;background:#fff1d1;border-radius:999px;padding:3px 10px;flex:none}.qrow.dn .qxp{color:var(--ok-dk,#2f8e72);background:var(--ok-soft,#e4f4ee)}
.qchest{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff6e0;border:2px dashed #e8c277}
.qchest.dn{border-style:solid;background:#fff1c4}
.qchsv{width:46px;height:42px;flex:none}.qct b{display:block;font-size:15px;font-weight:800;color:#7a4a1c}.qct small{font-size:12.5px;color:#9a6a2a;font-weight:700}
:root[data-theme=dark] .qcnt,:root[data-theme=dark] .qxp{background:#3a2f1c;color:#f2c14e}
:root[data-theme=dark] .qchest{background:#3a2f1c;border-color:#7a5c24}:root[data-theme=dark] .qct b{color:#f2c14e}:root[data-theme=dark] .qct small{color:#d1b077}
/* ---- 홈 정리: 퀘스트·시작 버튼·복습을 '오늘의 학습' 카드 하나로 ---- */
.quest .qact{margin-top:12px}
.quest .qact .cta{margin:0}
.quest .qact .lrow{border:0;border-top:1px solid var(--line);margin:0;padding:13px 2px;font-size:15px}
.quest .qact .lrow:first-of-type{margin-top:10px}
.quest .qact .hback{margin:0 0 10px}
.quest.shut .qact{margin-top:10px}
#profBtn{background:var(--card)!important;border:1px solid var(--line)!important;position:relative;z-index:2}
/* ===== 디자인 규칙 하나로: 모서리 12px(창은 16px) · 버튼은 '도톰한 주 버튼'과 '보조 버튼' 두 가지 · 칩은 완전히 둥글게 ===== */
.quest,.qchest,.fcard,.rt,.pk,.card,.t2,.gcard,.ncard,.tile,.panel,.kpi,.tbox,.reveal,.opt,.cta,.cta.sec,.qbox .opt,.opts4 .opt,.ex,.rel .lnk,.stats .panel,.jr,.mylvbox,select,input[type=search],input[type=text],textarea{border-radius:var(--rad)!important}
.inq .reveal{border-radius:16px 16px 0 0!important}
dialog{border-radius:16px!important}
.pill,.lvb,.tag,.qcnt,.qxp,.fk,.fu{border-radius:999px!important}
/* ===== 색 역할 고정: 초록=정답·완료 · 분홍/빨강=틀림 · 주황=진행 · 테라코타=행동 · 하단 탭 선택색도 하나로 ===== */
.views .vb.on{color:var(--accent-text)!important;background:var(--accent-soft)!important}
/* ---- 뉴스 필터: 평소엔 한 줄로 접어 두기 ---- */
.nfil{margin:6px 0 10px;border:1px solid var(--line);border-radius:var(--rad);padding:0 12px}
.nfil summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;font-weight:700;font-size:15px}
.nfil summary::-webkit-details-marker{display:none}
.nfil summary span{flex:1;color:var(--sub);font-weight:500;font-size:13.5px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nfil summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--sub);border-bottom:2.5px solid var(--sub);transform:rotate(45deg) translateY(-2px);flex:none}
.nfil[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.nfil[open]{padding-bottom:8px}
/* ===== 글자 하한선: 설명 글 14px · 보조·배지 12.5~13.5px (후리가나와 숫자 표시는 제외) ===== */
main .sub,main small,.fcs span,.grm,.grk{font-size:14px!important}
.pk em,.pk .pgt,.nmeta .sub,.src{font-size:13px!important}
.hbtag,.qcnt,.nbadge,.hsent .lab,.lvs,.fk,.fu{font-size:12.5px!important}
.grc small,.grtip b,.grcmp b{font-size:13px!important}

 표기법: 한자[읽기]  예) 食[た]べる  → 食 위에 'た' 후리가나

const POS = {
  "名詞":["명사","사물·사람·개념을 나타내는 말. 조사(が, を, は)가 뒤에 붙어요."],
  "名詞・する":["명사 + する 동사","する를 붙여 동사로 쓸 수 있는 명사. 예: 勉強 → 勉強する (공부하다)"],
  "一段動詞":["동사 · 2그룹(일단동사)","끝이 る. る를 떼고 ます를 붙임. 예: 食べる → 食べます"],
  "五段動詞":["동사 · 1그룹(오단동사)","끝 글자가 う단(う,く,す,む,る…)에서 활용. 예: 飲む → 飲みます / 飲まない"],
  "い形容詞":["い형용사","끝이 い. 그대로 명사를 꾸밈. 예: 高い本 / 부정: 高くない"],
  "な形容詞":["な형용사","명사 앞에서 な가 붙음. 예: 静かな町 / 부정: 静かではない"],
  "自動詞":["자동사","목적어(を) 없이 스스로 일어나는 일."],
  "副詞":["부사","동사·형용사 등을 꾸미는 말. 활용하지 않아요."],
  "不規則動詞":["불규칙 동사","来る(くる)와 する 두 개뿐. 따로 외워야 해요."],
  "他動詞":["타동사","を로 목적어를 받아 '~을 …하다'."]
};

const KANJI = {

 備:{ko:"갖출 비",on:"ビ",kun:"そな(える)",tip:"사람(亻)이 필요한 것을 갖추다."},
 心:{ko:"마음 심",on:"シン",kun:"こころ",tip:"심장의 모양."},

const $ = id => document.getElementById(id);
const KJ = "\\u4e00-\\u9fff々";
const kjRe = new RegExp("["+KJ+"]");
const rubyRe = new RegExp("(["+KJ+"]+)\\[([^\\]]+)\\]","g");
const toRuby  = s => s.replace(rubyRe,"<ruby>$1<rt>$2</rt></ruby>");
const plain   = s => s.replace(/\[[^\]]*\]/g,"");
const reading = s => s.replace(rubyRe,"$2");
const toKata  = s => s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const E = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R = s => toRuby(E(s));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const RAW = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); if(k.endsWith("@"+activeId)&&PER.includes(k.slice(0,k.indexOf("@")))) cloudSchedule(); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let profiles = RAW.get("jp-profiles",null), activeId = RAW.get("jp-active",null);
if(!Array.isArray(profiles)||!profiles.length){

   <div class="qbody"><div class="qlist">${L.map(x=>{ const dn=x.n>=x.of, inner=`${ring(x)}<div class="qm"><b>${E(x.t)}</b><small>${x.n} / ${x.of}${dn?"":" · 눌러서 하러 가기"}</small></div><span class="qxp">${dn?"받음":"+10 XP"}</span>`; return dn?`<div class="qrow dn">${inner}</div>`:`<button type="button" class="qrow go" data-qgo="${x.id}">${inner}</button>`; }).join("")}</div>
   ${L.length>=1?`<div class="qchest ${q.paid?"dn":""}">${chest}<div class="qct"><b>${q.paid?"오늘의 보상을 받았어요":"모두 끝내면 보물상자!"}</b><small>${q.paid?"내일 또 만나요":"🌱 씨앗 5개 · 20 XP"}</small></div></div>`:""}</div>${extra?`<div class="qact">${extra}</div>`:""}</div>`;

function logWrong(w,mode,picked,correct){ try{ if(!w||w.sent||!w.key) return; wlog.push({k:w.key,m:mode,p:String(picked||"").slice(0,60),c:String(correct||"").slice(0,60),t:Date.now()}); if(wlog.length>300) wlog=wlog.slice(-300); LS.set("jp-wlog",wlog); }catch(e){} }
/* 복습 화면에서 스스로 매긴 기억 정도(again/hard/good/easy)를 기록 · 오답 노트 · 복습 일정에 반영 */
const SRS_IV=[10/1440,1,3,7,14,30,60];
function recordRating(w,grade){
  if(!w||!w.key) return; const ok=grade==="good"||grade==="easy"; questInc("rev"); if(ok&&(w.key in wrong)) questInc("fix");
  const d=today(), e=log[d]||(log[d]={n:0,c:0}); e.n++; if(ok) e.c++;
  if(ok){ if(w.key in wrong){ wrong[w.key]++; if(wrong[w.key]>=2){ delete wrong[w.key]; toast("「"+w.text+"」 오답 노트에서 제외됐어요!"); } } }
  else if(grade==="again"){ wrong[w.key]=0; miss[w.key]=(miss[w.key]||0)+1; logWrong(w,"review",w.ko,w.ko); }
  LS.set("jp-log",log); LS.set("jp-wrong",wrong); LS.set("jp-miss",miss);
  const sr=LS.get("jp-srs",{}), x=sr[w.key]||{b:0}, b=x.b||0;
  x.b=grade==="again"?0:grade==="hard"?Math.max(1,b-1):grade==="good"?Math.min(6,b+1):Math.min(6,b+2);
  x.d=Date.now()+SRS_IV[x.b]*864e5; sr[w.key]=x; LS.set("jp-srs",sr);
  if(ok&&window.PATH) PATH.addXp(grade==="easy"?12:10);
  questCheck(); renderLevels();
}
let log    = LS.get("jp-log",{});      // 날짜 → {n:푼 문제, c:맞힌 문제}

/* な형용사는 사전형(〜だ)으로 보여 줘요. 문장·퀴즈 판별에는 어간(stem)을 써요 */
function rebuild(){ ALL = BASE.concat(custom); ALL.forEach(w=>{
  if(w.pos==="な形容詞"&&w.key[0]==="b"&&w.stem===undefined){ w.stem=w.f; if(!/だ$/.test(w.f)) w.f+="だ"; }
  const sf=w.stem||w.f; w.text=plain(sf); w.yomi=reading(sf); }); applyNoteGroups(ALL); applyKoFix3(ALL); }
const byKey = k => ALL.find(w=>w.key===k);
let level="전체", posf="", view="list", Q=null, kgSel="", kgMode="pair";   /* kgMode: pair=원래 말 기준(기본) · list=종류별 목록 */   /* kgSel: 경어에서 고른 종류(존경어·겸양어·정중어, ""=전체) */

const lvText = a => [...a].sort().reverse().join("·");   // N5·N4·N3 순서

const LEVELS = ["전체","N5","N4","N3","N2","N1","저장함","오답 노트","내 단어"];

function inScope(w){
  if(level==="저장함"){ if(!stars.has(w.key)) return false; }
  else if(level==="오답 노트"){ if(!(w.key in wrong)) return false; }
  else if(level==="내 단어"){ if(w.key[0]!=="c") return false; }
  else if(posf!=="경어" && !(view==="quiz"&&qpos==="k") && lvSel.size && !lvSel.has(w.lv) && !lvSel.has(w.lv2)) return false;   /* 경어는 급수로 나누지 않고 한꺼번에 보여 줘요 */
  if(posf){ if(posf==="경어"){ if(!w.kg||(kgSel&&w.kg!==kgSel)) return false; } else if(w.pos!==posf) return false; }   /* 경어는 품사 필터에서 골라요 (존경어·겸양어·정중어) */
  return view!=="quiz"||posGroupOk(w);
}
/* 퀴즈 품사 구분: 전체 / 명사 / 동사 / 형용사 / 부사 */
let qpos="", qscope="";   /* qscope: ""=급수로, 아니면 "저장함"·"내 단어"·"오답 노트" */
const QPOS=[["","전체"],["n","명사"],["v","동사"],["a","형용사"],["d","부사"],["k","경어"]];
const posGroupOk=w=>!qpos||(qpos==="k"?!!w.kg:qpos==="n"?w.pos.startsWith("名詞"):qpos==="v"?w.pos.includes("動詞"):qpos==="a"?w.pos.includes("形容詞"):w.pos==="副詞");
function filtered(){
  const q=$("q").value.trim().toLowerCase();
  const r=ALL.filter(w=>inScope(w) && (!q || w.text.includes(q) || w.yomi.includes(q) || toKata(w.yomi).includes(toKata(q)) || w.ko.includes(q)));
  if(posf==="경어"){ const K={"존경어":0,"겸양어":1,"정중어":2}, L={N5:0,N4:1,N3:2,N2:3,N1:4}; r.sort((a,b)=>(K[a.kg]-K[b.kg])||((L[a.lv]??9)-(L[b.lv]??9))); }   /* 종류별로 묶고, 안에서는 쉬운 급수부터 */
  return r;
}

function record(w,ok){

  else { wrong[w.key]=0; miss[w.key]=(miss[w.key]||0)+1; }

/* 단어장: 먼저 급수를 고르고(pick) → 단어를 파트별(100개씩)로 나눠 보여 줘요(words) */
const PART=100;

const LV_DESC={N5:"입문 · 기초",N4:"초급",N3:"중급",N2:"중상급",N1:"상급"};

   <div class="pkrow"><label class="tg"><input type="checkbox" id="pkMulti" ${pickMulti?"checked":""}> 여러 급수를 함께 보기</label>

/* 경어 화면 맨 위: 종류 고르기 + 같은 뜻의 존경어·겸양어 한눈에 보기 */
function kgPanel(){
  const all=ALL.filter(w=>w.kg), n=k=>k?all.filter(w=>w.kg===k).length:all.length;
  const modes=`<div class="kgmodes"><button type="button" class="kgc ${kgMode==="pair"?"on":""}" data-kgmode="pair">같은 뜻끼리 보기</button><button type="button" class="kgc ${kgMode==="list"?"on":""}" data-kgmode="list">종류별로 보기</button></div>`;
  const chips=kgMode==="list"?`<div class="kgchips">${[["","전체"],["존경어","존경어"],["겸양어","겸양어"],["정중어","정중어"]].map(([k,t])=>`<button type="button" class="kgc ${kgSel===k?"on":""}" data-kgsel="${k}" ${k?`data-k="${k}"`:""}>${t}<em>${n(k)}</em></button>`).join("")}</div>`:"";
  return `<div class="kgp">${modes}${chips}
   <p class="kgd"><b style="color:#2563eb">존경어</b> 상대의 동작을 높여요 · <b style="color:#d9730d">겸양어</b> 내 동작을 낮춰서 상대를 높여요 · <b style="color:#15935a">정중어</b> 말투를 정중하게 해요</p></div>`;

/* 경어 기본 보기(같은 뜻끼리 보기): 보통 말 하나마다 존경어·겸양어를 나란히 보여 줘서 비교하며 외우기 쉬워요 */
function kgPairs(){
  const K=ALL.filter(w=>w.kg), mt=new Map(); K.forEach(w=>mt.set(w.text,w)); K.forEach(w=>{ if(!mt.has(w.yomi)) mt.set(w.yomi,w); });
  const used=new Set();
  const chip=t=>{ const w=mt.get(t); if(!w) return ""; used.add(w.key); const m=String(w.ko).replace(/\s*\(.*?\)/g,"").split("·")[0].trim(); return `<button type="button" class="kgw" data-act="open" data-key="${w.key}"><span>${R(w.f)}</span><small>${E(m)}</small></button>`; };
  const col=(cls,label,items)=>`<div class="kgcol ${cls}"><em>${label}</em>${items||`<span class="kgno">—</span>`}</div>`;
  const row=p=>{ const son=(p.son||[]).map(chip).join(""), ken=(p.ken||[]).map(chip).join(""), jung=(p.jung||[]).map(chip).join("");
    if(!son&&!ken&&!jung) return "";

function kanjiBlocks(w){
  const re = new RegExp("(["+KJ+"]+)\\[([^\\]]+)\\]","g"), out=[]; let m;
  while((m = re.exec(w.f))) out.push([m[1],m[2]]);
  const base = s => toKata(s).normalize("NFD").replace(/[゙゚]/g,"");
  const seen = new Set(); let html="";
  out.forEach(([ks,r])=>{
    [...ks].forEach(k=>{
      if(seen.has(k)) return; seen.add(k);
      const d = KANJI[k];
      if(!d){ html+=`<div class="kj"><div><div class="c">${k}</div></div><div class="r sub">아직 한자 사전에 없는 글자예요.</div></div>`; return; }
      let use="";
      if(ks.length===1){
        const ons = d.on.split("・").map(base);
        const kuns = d.kun.split("・").map(s=>s.replace(/\(.*?\)/g,""));
        const type = ons.includes(base(r)) ? "음독" : (kuns.includes(r) ? "훈독" : "특수 읽기");
        use = `<div class="r">이 단어에서: <span class="${type==="음독"?"on-t":"kun-t"}">${E(r)}</span> (${type})</div>`;
      } else use = `<div class="r">「${E(ks)}」 전체 읽기: <b>${E(r)}</b></div>`;
      html+=`<div class="kj">
        <div><div class="c">${k}</div><div class="ko">${d.ko}</div></div>
        <div>${use}
          <div class="r"><span class="on-t">음독</span> ${d.on||"-"} &nbsp; <span class="kun-t">훈독</span> ${d.kun||"-"}</div>
          <div class="tip"><b>TIP</b> ${d.tip}</div></div></div>`;
    });
  });
  return html;
}

function autoMarkup(word,yomi){
  if(!kjRe.test(word)) return word;
  const segs = word.match(new RegExp("["+KJ+"]+|[^"+KJ+"]+","g"))||[];
  let pos=0,out="";
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(kjRe.test(s[0])){
      const next=segs[i+1];
      const end = next===undefined ? yomi.length : yomi.indexOf(next,pos+1);
      if(end<0) return null;
      const r=yomi.slice(pos,end); if(!r) return null;
      out+=s+"["+r+"]"; pos=end;
    } else {
      if(yomi.substr(pos,s.length)!==s) return null;
      out+=s; pos+=s.length;
    }
  }
  return pos===yomi.length ? out : null;
}

// 예문을 문절 단위로 쪼개기 (조사·읽점·문자 종류가 바뀌는 곳)
function chunkSentence(s){
  const out=[]; let cur="";
  const isP=c=>"はがをにでともへ".includes(c), isKata=c=>/[゠-ヿ]/.test(c), isHira=c=>/[ぁ-ゖ]/.test(c);
  for(let i=0;i<s.length;i++){
    const c=s[i], n=s[i+1], p=s[i-1]; cur+=c;
    if(!n) break;
    const prevOk = p && (kjRe.test(p) || isKata(p));
    const cut = c==="、"
      || (isP(c) && prevOk && !isP(n) && n!=="の" && !(c==="で"&&n==="す"))
      || (kjRe.test(c) && isKata(n)) || (isKata(c) && kjRe.test(n))
      || (isHira(c) && kjRe.test(n) && c!=="、" && !isP(c));
    if(cut){ out.push(cur); cur=""; }
  }
  if(cur) out.push(cur);
  return out;
}

/* 문장 순서용: 조사를 따로 떼어 문절 단위로 쪼개요 (예: 昨日/友達/と/恋愛/について/話/を/しました) */
function chunkOrd(raw){
  const s=raw.replace(new RegExp("\\](?=["+KJ+"])","g"),"]\u0001").replace(/\[[^\]]*\]/g,"");  // 후리가나 단어 경계(]) 뒤 한자에서 끊기
  const SINGLE="はがをにでともへの";
  const MULTI=["ですから","にとって","について","によって","として","でしょう","には","では","とは","へは","にも","でも","とも","へも","から","まで","より","など","だけ","しか","ので","のに","です","でした"];
  const isKata=c=>/[゠-ヿ]/.test(c)&&c!=="・", isHira=c=>/[ぁ-ゖ]/.test(c);
  const out=[]; let cur="", i=0;
  while(i<s.length){
    const c=s[i], p=s[i-1];
    if(c==="\u0001"){ if(cur){ out.push(cur); cur=""; } i++; continue; }
    if(cur && p && (kjRe.test(p)||isKata(p))){
      const m=MULTI.find(t=>s.startsWith(t,i));
      if(m && !(m==="から"&&s[i+2]==="な")){ out.push(cur,m); cur=""; i+=m.length; continue; }
      if(SINGLE.includes(c) && !(c==="が"&&"るっりられ".includes(s[i+1]||""))){ out.push(cur,c); cur=""; i++; continue; }
    }
    cur+=c; const n=s[i+1]; i++;
    if(!n) break;
    let cut=false;
    if(c==="、"||c==="。") cut=!(n==="、"||n==="。");
    else if(n==="、"||n==="。") cut=false;
    else if((kjRe.test(c)&&isKata(n))||(isKata(c)&&kjRe.test(n))) cut=true;
    else if(isHira(c)&&kjRe.test(n)&&(cur.length>=3||(cur.length>=2&&!kjRe.test(cur[0])))) cut=true;
    if(cut){ out.push(cur); cur=""; }
  }
  if(cur) out.push(cur);
  const m=[];
  out.filter(x=>x).forEach(x=>{ if(m.length&&(/^[、。]$/.test(x)||(x.length===1&&/[ぁ-ゖー゠-ヿ]/.test(x)&&!SINGLE.includes(x)))) m[m.length-1]+=x; else m.push(x); });
  return m;
}

const ORD_PART=["は","が","を","に","で","と","も","へ","の"];
function mkOrd(w){
  const orig=chunkOrd(w.ex[0].ja), have=new Set(orig), want=orig.length<=4?2:orig.length<=7?1:0, dec=[];
  /* 문장에 안 쓰는 함정 조각: 조사가 있으면 다른 조사로 바꿔 헷갈리게, 그다음엔 다른 문장의 단어 조각 */
  if(orig.some(c=>ORD_PART.includes(c))) shuffle(ORD_PART.filter(p=>!have.has(p))).slice(0,1).forEach(p=>{ if(dec.length<want) dec.push(p); });
  for(let t=0;dec.length<want&&t<60;t++){
    const x=ALL[Math.floor(Math.random()*ALL.length)]; if(!x||!x.ex||!x.ex[0]||!x.ex[0].ja||x.key===w.key) continue;
    const c=shuffle(chunkOrd(x.ex[0].ja).filter(k=>k.length>=2&&k.length<=5&&kjRe.test(k)&&!have.has(k)&&!dec.includes(k)))[0]; if(c) dec.push(c);
  }

  do{ idx=shuffle(idx); }while(items.length===orig.length&&idx.every((v,i)=>v===i)&&t++<10);

let RBD=null;
function rbDict(){

const HEART_COL={on:{O:"#4a1226",R:"#ff4d6d",W:"#ffc2cf"},off:{O:"#8b97b3",R:"#dde5f2",W:"#dde5f2"}};

const RANKS=["일본어 새싹","단어 탐험가","단어 사냥꾼","한자 달인","한자 마스터"];
const LADDERS={match:[0,150,375,750,1200],time:[0,120,300,600,975],wordle:[0,20,60,100,120],shiri:[0,90,225,450,750],fall:[0,90,225,450,750]};
function rankOf(score,type){
  const L=LADDERS[type]||LADDERS.time; let i=0; L.forEach((v,k)=>{ if(score>=v) i=k; });

}
function gTick(){

      <button class="star ${stars.has(w.key)?"on":""}" data-act="gstar" data-key="${w.key}" title="저장함에 담기" aria-label="저장함에 담기">${ic("star")}</button></div>`).join("")}</div></div></div>`;

/* 게임 시작 전 3-2-1 카운트다운 (끝나면 시간이 흐르기 시작해요) */
function gCountdown(rule,go,extraCls){
  stopG(); Q=null; G={type:"cd"}; let n=3;
  const tick=()=>{
    if(!G||G.type!=="cd"||!QV(view)) return;
    $("quizView").innerHTML=`<div class="qbox gbox cdbox ${extraCls||""}"><div class="cdmk">${MONKEY}</div><div class="sub">준비하세요</div><div class="cdnum">${n>0?n:"시작!"}</div><p class="sub">${rule}</p><div class="qbtns"><button class="pill" data-act="gquit">취소</button></div></div>`;
    sfx(n>0?"tick":"go");
    if(n===0){ gFlash=setTimeout(()=>{ if(G&&G.type==="cd") go(); },600); return; }
    n--; gFlash=setTimeout(tick,850);
  };
  tick();
}
/* 짝 맞추기: 제한 시간 안에 최대한 많은 쌍을 맞혀요 (한 라운드를 끝내면 시간이 늘어나요) */
function startMatch(){
  const seen=new Set(), uniq=[];
  for(const w of wshuffle(ALL.filter(inScope))){ if(w.ko && !seen.has(w.ko)){ seen.add(w.ko); uniq.push(w); } }
  if(uniq.length<6){ toast("이 범위에는 단어가 부족해요 (6개 이상 필요)"); return; }
  gCountdown("왼쪽 단어와 같은 뜻을 오른쪽에서 골라요<br>제한 시간 90초 · 틀리면 2초 줄어요",()=>beginMatch(uniq));
}
function beginMatch(uniq){
  G={type:"match",seen:new Map(),marks:new Set(),uniq,ptr:0,round:0,total:90000,end:Date.now()+90000,score:0,combo:0,pairs:0,maxc:0,wrong:new Map(),busy:false,pop:""};
  matchRound(); gTimer=setInterval(gTick,100); bgmStart();
}
function matchWord(){ const n=G.uniq.length; const shown=new Set([...G.cur,...G.right,...G.qL,...G.qR].map(x=>x.key)); let w,t=0; do{ w=G.uniq[G.ptr++%n]; }while(shown.has(w.key)&&++t<n); return w; }
function matchRound(){
  /* 처음 화면: 왼쪽 6개 · 오른쪽 6개. 짝이 없는 칸이 2개씩 있어서(w5·w6의 뜻은 나중에, w7·w8은 나중에 단어가 나와요) 새로 채워지는 칸이 서로의 짝이 되지 않아요 */
  const ws=[], n=G.uniq.length; while(ws.length<6&&G.ptr<n*3){ const w=G.uniq[G.ptr++%n]; if(!ws.some(x=>x.key===w.key)) ws.push(w); }
  G.cur=ws.slice(0,4); G.right=shuffle([ws[0],ws[1],ws[4],ws[5]]); G.qL=[ws[4],ws[5]]; G.qR=[ws[2],ws[3]];
  ws.forEach(w=>{ if(!G.seen.has(w.key)) G.seen.set(w.key,{w,st:"no"}); });
  G.done=new Set(); G.missed=new Set(); G.sel=null; G.bad=null; G.busy=false; renderMatch();
}
function renderMatch(){
  const cls=(side,w)=>G.done.has(w.key)?"good"+(G.last===w.key?" just":""):(G.bad&&G.bad[side]===w.key)?"bad":(G.sel&&G.sel.side===side&&G.sel.key===w.key)?"sel":((side==="l"?G.newL:G.newR)===w.key?"newin":"");
  const tile=(side,w,html)=>`<button class="opt ${cls(side,w)}" data-act="gm" data-side="${side}" data-key="${w.key}">${html}${side==="l"?`<span class="gst2 ${stars.has(w.key)?"on":""}" role="button" tabindex="-1" data-act="gmark" data-key="${w.key}" title="나중에 볼 단어로 저장" aria-label="나중에 볼 단어로 저장">${ic("star")}</span>`:""}</button>`;
  const left=Math.max(0,G.end-Date.now());
  $("quizView").innerHTML=`<div class="qbox gbox"><div class="gfx" id="gfx"></div>
   <div class="gstat"><span id="gt">${Math.ceil(left/1000)}초</span><span class="gsc"><small>점수</small><b>${G.score}</b></span></div>${mbarHTML(left)}
${G.pop?`<p class="sub" style="text-align:center"><b>${G.pop}</b></p>`:""}
   <div class="gcols"><div class="gcol">${G.cur.map(w=>tile("l",w,E(w.text)+(w.text!==w.yomi?`<small>${E(w.yomi)}</small>`:""))).join("")}</div>
   <div class="gcol">${G.right.map(w=>tile("r",w,E(w.ko))).join("")}</div></div>
   <div class="qbtns">${sndBtn()}<button class="pill" data-act="gstop">게임 중단</button><button class="pill" data-act="gquit">그만하기</button></div></div>`;
}
function matchPick(side,key){
  if(!G||G.type!=="match"||G.busy||G.done.has(key)) return;
  G.last=null; G.newL=null; G.newR=null;
  if(!G.sel||G.sel.side===side){ G.sel=(G.sel&&G.sel.side===side&&G.sel.key===key)?null:{side,key}; renderMatch(); return; }
  const lk=side==="l"?key:G.sel.key, rk=side==="r"?key:G.sel.key;
  if(lk===rk){
    const w=byKey(lk), first=!G.missed.has(lk); record(w,first); if(!first) G.wrong.set(lk,w);
    G.seen.get(lk).st=first?"ok":"ng";
    if(first){ G.score+=10+2*Math.min(G.combo,10); G.combo++; G.maxc=Math.max(G.maxc,G.combo); } else { G.score+=5; G.combo=0; }
    const pts=first?10+2*Math.min(G.combo-1,10):5;
    G.pairs++; G.done.add(lk); G.last=lk; G.sel=null; G.pop=""; sfx("ok");
    if(G.pairs%4===0){ G.end+=12000; G.pop="+12초"; sfx("clear"); popFx("+12초","clr"); }
    G.busy=true; renderMatch();
    /* 한 쌍을 맞히면 그 자리에 바로 새 단어가 채워져요 */
    const g=G, li=G.cur.findIndex(x=>x.key===lk), ri=G.right.findIndex(x=>x.key===lk);
    gFlash=setTimeout(()=>{ if(G!==g) return; let nl,nr;
      if(G.qL.length){ nl=G.qL.shift(); nr=G.qR.shift(); }
      else{ nl=matchWord(); G.qR.push(nl); nr=matchWord(); G.qL.push(nr); }
      [nl,nr].forEach(w=>{ if(!G.seen.has(w.key)) G.seen.set(w.key,{w,st:"no"}); });
      if(li>=0) G.cur[li]=nl; if(ri>=0) G.right[ri]=nr; G.done.delete(lk); G.newL=nl.key; G.newR=nr.key; G.busy=false; G.pop=""; renderMatch(); },200);
    popFx("+"+pts,"pts"); if(first&&G.combo>=3) popFx(G.combo+" 콤보!",cmbCls(G.combo));
  } else {
    G.combo=0; G.end-=2000; G.missed.add(lk); G.missed.add(rk); [lk,rk].forEach(k=>{ const r=G.seen.get(k); if(r) r.st="ng"; }); G.bad={l:lk,r:rk}; G.busy=true; G.pop="-2초"; sfx("ng"); renderMatch(); popFx("-2초","pts neg");
    const g=G; gFlash=setTimeout(()=>{ if(G!==g) return; G.bad=null; G.sel=null; G.busy=false; G.pop=""; renderMatch(); },450);
  }
}
function endMatch(){ gOver(endMatchNow); }
function endMatchNow(){
  sfx("end");
  const g=G, prev=getBest("match2"), isNew=g.score>0&&(prev==null||g.score>prev);
  if(isNew) setBest("match2",g.score);
  if(window.MRANK) MRANK.submit(g.score);
  gResult({title:"짝 맞추기 결과",big:g.score+"점",score:g.score,isNew,seen:g.seen,marks:g.marks,type:"match",
    note:`${g.stopped?"게임을 중단했어요":"시간이 끝났어요"}${prev!=null&&!isNew?` · 최고 기록 ${prev}점`:""}`});
}
/* 60초 타임어택 */
function startTime(){
  const pool=ALL.filter(inScope);
  if(pool.length<4){ toast("이 범위에는 단어가 부족해요 (4개 이상 필요)"); return; }
  gCountdown("60초 안에 최대한 많이 맞혀요<br>하트 3개를 모두 잃으면 끝나요",()=>beginTime(pool));
}
function beginTime(pool){
  G={type:"time",seen:new Map(),marks:new Set(),pool:shuffle(pool),i:0,total:60000,end:Date.now()+60000,lives:3,score:0,combo:0,maxc:0,right:0,asked:0,wrong:new Map(),sel:null,q:null,lock:false};
  nextTime(); gTimer=setInterval(gTick,100); bgmStart();
}
function nextTime(){
  const w=G.pool[G.i++%G.pool.length], key=(w.text!==w.yomi&&Math.random()<.4)?"yomi":"ko";
  G.q={w,key,opts:choices(w,key)}; G.sel=null; G.lock=false; G.lostIdx=-1; renderTime();
}
function renderTime(){
  const q=G.q, w=q.w, left=Math.max(0,G.end-Date.now()), done=G.sel!==null;
  $("quizView").innerHTML=`<div class="qbox gbox"><div class="gfx" id="gfx"></div>
   <div class="gstat"><span id="gt">${Math.ceil(left/1000)}초</span><span class="gsc"><small>점수</small><b>${G.score}</b></span>
    <span class="hp" role="img" aria-label="남은 기회 ${G.lives}번">${[0,1,2].map(i=>heart(i<G.lives,i===G.lostIdx)).join("")}</span></div>${mbarHTML(left)}
   <div class="sub">${q.key==="ko"?"이 단어의 뜻은?":"이 단어의 읽기는?"}</div><div class="qw">${E(w.text)}</div>
   <div class="opts4">${q.opts.map((o,i)=>`<button class="opt ${done?(o===w[q.key]?"correct":i===G.sel?"wrong":""):""}" data-act="gopt" data-i="${i}" ${done?"disabled":""}><kbd>${i+1}</kbd>${E(o)}</button>`).join("")}</div>
   <div class="qbtns"><button class="pill sm" data-act="gmark" data-key="${w.key}" id="gmarkbtn">${stars.has(w.key)?"저장함에 담았어요":"나중에 볼래요"}</button>${sndBtn()}<button class="pill" data-act="gstop">게임 중단</button><button class="pill" data-act="gquit">그만하기</button></div></div>`;
}
function timePick(i){
  if(!G||G.type!=="time"||G.lock||i>=G.q.opts.length) return;
  const q=G.q, w=q.w, ok=q.opts[i]===w[q.key];
  G.sel=i; G.lock=true; G.asked++; record(w,ok); sfx(ok?"ok":"ng");
  { const r=G.seen.get(w.key); G.seen.set(w.key,{w,st:(ok&&(!r||r.st!=="ng"))?"ok":"ng"}); }
  const before=G.combo, pts=10+2*Math.min(before,10);
  if(ok){ G.right++; G.score+=pts; G.combo++; G.maxc=Math.max(G.maxc,G.combo); }
  else { G.lives--; G.lostIdx=G.lives; G.combo=0; G.wrong.set(w.key,w); }
  renderTime();
  if(ok){ popFx("+"+pts,"pts"); if(G.combo>=3) popFx(G.combo+" 콤보!",cmbCls(G.combo)); }
  else if(before>=3) popFx("연속 끊김","cmb neg");
  const g=G; gFlash=setTimeout(()=>{ if(G!==g) return; (G.lives<=0||Date.now()>=G.end) ? endTime() : nextTime(); }, ok?450:1100);
}
function endTime(){ gOver(endTimeNow); }
function endTimeNow(){
  sfx("end");
  const prev=getBest("time"), isNew=G.score>0&&(prev==null||G.score>prev);
  if(isNew) setBest("time",G.score);
  const g=G, why=g.stopped?"게임을 중단했어요":g.lives<=0?"기회를 모두 썼어요":"시간이 끝났어요";
  gResult({title:"타임어택 결과",big:g.score+"점",score:g.score,isNew,seen:g.seen,marks:g.marks,type:"time",
    note:`${why} · 맞힌 문제 ${g.right} / ${g.asked} · 최고 연속 ${g.maxc}${prev!=null&&!isNew?` · 최고 기록 ${prev}점`:""}`});
}
/* ---------- JLPT 모의시험 ---------- */
const JSEC={vocab:"문자·어휘",pair:"유의 표현",gram:"문법",read:"독해",listen:"청해"};
const jlv=()=>["N5","N4","N3","N2","N1"].includes(prefs.jl)?prefs.jl:(myLv()[0]||"N5");
const jlvQ=()=>prefs.jl==="전체"?"전체":jlv();   /* 퀴즈·게임은 '전체' 급수도 고를 수 있어요 */
const jWords=lv=>ALL.filter(w=>w.lv===lv);
function jShuf(opts,ai){ const o=shuffle(opts.map((x,i)=>({x,ok:i===ai}))); return {o:o.map(v=>v.x),a:o.findIndex(v=>v.ok)}; }
function jBank(bank,lv){
  let L=bank.filter(x=>x.lv===lv);
  if(L.length<3){ const order=["N5","N4","N3","N2","N1"], k=order.indexOf(lv); const near=bank.filter(x=>Math.abs(order.indexOf(x.lv)-k)===1); L=L.concat(near); }
  return L;
}
function jReading(lv,n){
  return wshuffle(jWords(lv).filter(w=>w.text!==w.yomi)).slice(0,n).map(w=>{ const o=choices(w,"yomi");
    return {sec:"vocab",kind:"한자 읽기",prompt:"이 한자의 읽기는?",stem:`<div class="qw">${E(w.text)}</div>`,opts:o.map(E),a:o.indexOf(w.yomi),exp:`${R(w.f)} · ${E(w.ko)}`,w}; });
}
const jRe=w=>new RegExp([...w.text].map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:\\[[^\\]]*\\])?").join(""));
function jContext(lv,n){
  const pool=jWords(lv).filter(w=>w.ex&&w.ex[0]&&["名詞","副詞","い形容詞","な形容詞"].includes(w.pos)&&w.text.length>=2&&jRe(w).test(w.ex[0].ja));
  return wshuffle(pool).slice(0,n).map(w=>{
    const sj=plain(w.ex[0].ja);
    const same=shuffle(jWords(lv).filter(x=>x.pos===w.pos&&x.text!==w.text&&!sj.includes(x.text))).slice(0,3);
    if(same.length<3) return null;
    const m=jShuf([w.f,...same.map(x=>x.f)],0);
    return {sec:"vocab",kind:"문맥 규정",prompt:"（　）에 들어갈 알맞은 말은?",stem:`<div class="jq">${R(w.ex[0].ja.replace(jRe(w),"（　　）"))}</div>`,opts:m.o.map(R),a:m.a,exp:`${R(w.ex[0].ja)}<br>${E(w.ex[0].ko)} · ${E(w.text)} = ${E(w.ko)}`,w};
  }).filter(Boolean);
}
function jSyn(lv,n){
  return shuffle(jBank(window.JLPT_SYN||[],lv)).slice(0,n).map(b=>{ const m=jShuf(b.o,b.a);
    return {sec:"vocab",kind:"유의 표현",prompt:"밑줄 친 말과 뜻이 가장 가까운 것은?",stem:`<div class="jq">${R(b.s).replace(/\{([^}]*)\}/g,"<u>$1</u>")}</div>`,opts:m.o.map(R),a:m.a,exp:E(b.e||"")}; });
}
function jGram(lv,n){
  return shuffle(jBank(window.JLPT_GRAM||[],lv)).slice(0,n).map(b=>{ const m=jShuf(b.o,b.a);
    return {sec:"gram",kind:"문법 형식",prompt:"（　）에 들어갈 알맞은 말은?",stem:`<div class="jq">${R(b.q)}</div>`,opts:m.o.map(R),a:m.a,exp:R(b.e||"")}; });
}
function jRead(lv,n){
  const arts=(window.ARTICLES||[]).filter(a=>a.body&&a.body.length>=3);
  const qOf=a=>(a.qs&&a.qs.length?a.qs:(window.JLPT_READQ||{})[a.id])||null;
  let pool=arts.filter(a=>a.lv===lv); if(pool.length<2) pool=arts;
  const withQ=shuffle(pool.filter(qOf)), noQ=shuffle(pool.filter(a=>!qOf(a)));
  return withQ.concat(noQ).slice(0,n).map(a=>{
    const passage=`<div class="jpass"><b>${R(a.title)}</b>${a.body.map(b=>R(b.ja)).join("")}</div>`, qs=qOf(a);
    if(qs){ const q=shuffle(qs)[0], m=jShuf(q.o,0);

function rdgDoc(lines){

  else if(a==="saveWrong"){ Q.wrong.filter(w=>!w.sent).forEach(w=>stars.add(w.key)); LS.set("jp-star",[...stars]); toast(Q.wrong.length+"개를 저장함에 담았어요"); }
  else if(a==="again"||a==="qquit"){ jStop(); Q=null; if(a==="qquit"&&quizFrom){ const v=quizFrom; quizFrom=null; setView(v); return; } quizSetup(); }
  else if(a==="open"){ if(byKey(b.dataset.key)) openWord(b.dataset.key); }
  else if(a==="later"){ const k=b.dataset.key; if(!k) return; if(k in wrong){ delete wrong[k]; b.textContent="나중에 다시 풀기"; b.classList.remove("on"); b.setAttribute("aria-pressed","false"); toast("나중에 다시 풀기를 취소했어요"); } else { wrong[k]=0; b.textContent="나중에 다시 풀기 ✓"; b.classList.add("on"); b.setAttribute("aria-pressed","true"); toast("나중에 다시 풀 수 있게 담았어요"); } LS.set("jp-wrong",wrong); renderLevels(); }
  else if(a==="sent"){ const w=Q&&Q.list&&Q.list[Q.i]; if(w&&w.ex&&w.ex[0]) showSentence(w); }
});

//  - 읽기 기사(articles.js)와 삽화(ILLUS)는 이 앱을 위해 직접 만든 것이에요.
//  - 정부 발표는 제목만, 출처를 표시해서 보여 줘요. 본문·사진은 가져오지 않고 외부 링크도 달지 않아요.

const NEWS_PAGE=10; let newsLimit=NEWS_PAGE, newsSig="";
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function buildMatchers(){
  const KR="\\u4e00-\\u9fff々";
  return ALL.map(w=>{
    const t=w.text; if(!t||t.length<2&&!kjRe.test(t)) return null;
    const hasK=kjRe.test(t);
    let pat=escRe(t);
    if(hasK && !kjRe.test(t.slice(-1)) && ["一段動詞","五段動詞","い形容詞"].includes(w.pos)){
      const stem=t.slice(0,-1);
      pat = stem.length===1 ? "(?<!["+KR+"])"+escRe(stem)+"(?!["+KR+"])" : escRe(stem);
    } else if(!hasK && t.length<3) return null;
    return {w,re:new RegExp(pat,"g")};
  }).filter(Boolean);
}
function annotate(text,ms){
  const ranges=[];
  ms.forEach(({w,re})=>{ re.lastIndex=0; let m; while((m=re.exec(text))){ if(!m[0]){re.lastIndex++;continue;} ranges.push([m.index,m.index+m[0].length,w]); } });
  ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  let pos=0,html="",hit=new Map();
  for(const [s,e,w] of ranges){
    if(s<pos) continue;
    html+=E(text.slice(pos,s))+`<mark data-key="${w.key}" title="${E(w.yomi)} · ${E(w.ko)}">${E(text.slice(s,e))}</mark>`;
    pos=e; hit.set(w.key,w);
  }
  return {html:html+E(text.slice(pos)),hit};
}

/* 기기에 있는 일본어 음성 중 가장 자연스러운 것을 골라요(고음질·Siri·Google·Microsoft 계열을 먼저) */
/* 일본어 음성은 한 번 고르면 계속 같은 목소리를 써요 (처음엔 음성 목록이 비어 있어서 기본 목소리로 나왔다가, 나중에 다른 목소리로 바뀌는 문제를 막아요) */
let JVOICE=null;
function bestJa(){
  const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^ja/i.test(v.lang)); if(!vs.length) return JVOICE;
  if(JVOICE){ const same=vs.find(v=>v.voiceURI===JVOICE.voiceURI); if(same) return (JVOICE=same); }
  let want=""; try{ want=localStorage.getItem("jp-voice")||""; }catch(e){}
  const saved=want&&vs.find(v=>v.voiceURI===want); if(saved) return (JVOICE=saved);
  const score=v=>(/premium|enhanced|siri|neural|natural|online/i.test(v.name)?4:0)+(/google|microsoft|kyoko|o-ren|nanami|haruka/i.test(v.name)?2:0)+(v.localService?0:1);
  JVOICE=vs.slice().sort((x,y)=>score(y)-score(x)||(x.name<y.name?-1:1))[0];
  try{ localStorage.setItem("jp-voice",JVOICE.voiceURI); }catch(e){}
  return JVOICE; }
/* 음성 목록이 아직 안 올라왔으면 잠깐(최대 0.8초) 기다렸다가 읽어요 */
function whenVoices(cb){
  const ss=window.speechSynthesis; if(!ss||ss.getVoices().length){ cb(); return; }
  let done=false; const f=()=>{ if(done) return; done=true; try{ ss.removeEventListener("voiceschanged",f); }catch(e){} cb(); };
  try{ ss.addEventListener("voiceschanged",f); }catch(e){} setTimeout(f,800);
}
function speakJa(t,rate){ try{ const ss=speechSynthesis; ss.cancel();
  whenVoices(()=>setTimeout(()=>{ const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; u.rate=rate||.9; const v=bestJa(); if(v) u.voice=v; ss.speak(u); },60)); }catch(e){} }
/* 단어 발음: 한 글자짜리 읽기(は·て·き 등)는 히라가나만 주면 뭉개지거나 조사처럼(は→와) 읽혀서, 한자 표기를 같이 줘서 정확히 읽게 해요 */
/* 단어 발음: 미리 만든 또렷한 음성(audio/word, VOICEVOX)이 있으면 그걸 틀고, 없으면 폰 음성으로 읽어요 */
const wordKey=y=>{ let h=5381,g=7; const s="word1|"+y; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; g=(g*131+s.charCodeAt(i))>>>0; } return h.toString(36)+g.toString(36); };
let wAud=null;
function sayWord(w){
  const k=wordKey(w.yomi||""), A=window.WORD_AUDIO||{};
  if(A[k]){ try{ speechSynthesis.cancel(); }catch(e){} if(wAud){ try{ wAud.pause(); }catch(e){} } wAud=new Audio("audio/word/"+k+".m4a"); wAud.play().catch(()=>speakJa(ttsOf(w),.8)); return; }
  speakJa(ttsOf(w),.8);
}

    const go=()=>{ if(tok===jTok) setTimeout(next,gap); }; u.onend=go; u.onerror=go; try{ speechSynthesis.resume(); }catch(e){} speechSynthesis.speak(u); };

let selTimer, selInfo=null;
const hideSel = () => { $("seltool").hidden=true; };
function updateSel(){
  if(view!=="read") return hideSel();
  const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount) return hideSel();
  const rng=s.getRangeAt(0), frag=rng.cloneContents(); frag.querySelectorAll("rt").forEach(x=>x.remove());
  const t=frag.textContent.trim();
  if(!t||t.length>30||t.includes("\n")) return hideSel();
  const node=rng.commonAncestorContainer, el=node.nodeType===1?node:node.parentElement;
  if(!(el&&el.closest&&el.closest(".reader"))) return hideSel();
  const exist=ALL.find(w=>w.text===t);
  const blk=el.closest(".rja,.rtitle"); let sent="";
  if(blk){ const c=blk.cloneNode(true); c.querySelectorAll("rt").forEach(x=>x.remove()); sent=c.textContent.trim(); }
  selInfo={t,sent};
  const bar=$("seltool");
  bar.innerHTML=`<b>「${E(t)}」</b>
    <a href="https://ja.dict.naver.com/#/search?query=${encodeURIComponent(t)}" target="_blank" rel="noopener noreferrer">네이버 사전</a>
    <a href="https://jisho.org/search/${encodeURIComponent(t)}" target="_blank" rel="noopener noreferrer">Jisho</a>

  bar.hidden=false;
  const r=rng.getBoundingClientRect(), w=bar.offsetWidth, h=bar.offsetHeight;
  bar.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+"px";
  bar.style.top=(r.bottom+8+h>innerHeight ? Math.max(8,r.top-h-8) : r.bottom+8)+"px";
}

  if(e.target===$("dlg") || e.target.closest("[data-close]")) return $("dlg").close();
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="open"){ if(byKey(b.dataset.key)) openWord(b.dataset.key); return; }
  if(a==="report"){ const w=byKey(b.dataset.key); if(w&&w.ex&&w.ex[0]) reportIssue(w,w.ex[0]); return; }
  if(a==="reportcur"){ if(curSent) reportIssue(curSent,curSent.ex[0]); return; }
  if(a==="prev") step(-1); else if(a==="next") step(1);
  else if(a==="say"){ const w=byKey(nav[navI]); if(w) sayWord(w); }
  else if(a==="star"){ toggleStar(nav[navI]); showWord(); if(view==="list") renderGrid(); }
  else if(a==="del"){
    if(!confirm("이 단어를 삭제할까요?")) return;
    const k=nav[navI]; custom=custom.filter(w=>w.key!==k); stars.delete(k); delete wrong[k]; delete miss[k];
    LS.set("jp-custom",custom); LS.set("jp-star",[...stars]); LS.set("jp-wrong",wrong); LS.set("jp-miss",miss); rebuild();
    $("dlg").close(); renderLevels(); refresh(); toast("삭제했어요");
  }
});
$("addDlg").addEventListener("click",e=>{ if(e.target===$("addDlg") || e.target.closest("[data-close]")) $("addDlg").close(); });
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
  if($("dlg").open){ if(e.key==="ArrowLeft") step(-1); else if(e.key==="ArrowRight") step(1); return; }
  if(G && G.type==="time" && QV(view) && !$("addDlg").open){ if(/^[1-4]$/.test(e.key)) timePick(+e.key-1); return; }
  if($("addDlg").open || !QV(view) || !Q || Q.done) return;
  if(Q.mode==="jlpt"){ if(/^[1-4]$/.test(e.key)) jPick(+e.key-1); else if(e.key===" "&&Q.sel!==null){ e.preventDefault(); jNext(); } return; }
  if(Q.mode==="card"){
    if(e.key===" "){ e.preventDefault(); if(!Q.flip){ Q.flip=true; renderQ(); } }
    else if(Q.flip && e.key==="ArrowRight") grade(true);
    else if(Q.flip && e.key==="ArrowLeft") grade(false);
  } else if(e.key===" "){ if(Q.sel!==null){ e.preventDefault(); nextQ(); } }
  else if(/^[1-4]$/.test(e.key)) pick(+e.key-1);
});

  const p=curProfile(), cu=cloud.ok&&cloud.auth.currentUser, others=profiles.filter(x=>!x.cloud&&x.id!==activeId);
  const acct=p.cloud
    ? `<div class="pfname"><b>${E(p.name)}</b><span class="sub">${E((cu&&cu.email)||"")}</span></div>`
    : `<div class="pfname"><b>게스트</b><span class="sub">기록이 이 기기에만 저장돼요. 로그인하면 다른 기기에서도 이어져요.</span></div>`;
  const hero=window.PATH?PATH.profileHtml():"";
  $("profDlg").innerHTML=`<div class="dh"><h2 style="margin:0">내 계정</h2><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db pfdb">${hero}${acct}
   <div class="pfbtns">${window.PATH?`<button class="pill on" data-pa="shop">참새 꾸미기</button>`:""}<button class="pill ${window.PATH?"":"on"}" data-pa="stats">${ic("chart")} 학습 기록</button></div>
   ${p.cloud?`<button class="pfout" data-pa="logout">로그아웃</button><button class="pfout pfdel" data-pa="delacct">계정 삭제</button>`
     :`<div class="qbtns" style="margin:0"><button class="pill" data-pa="login">로그인</button><button class="pill" data-pa="signup">회원가입</button></div>`}
   ${!p.cloud&&others.length?`<p class="sub" style="margin-top:14px">이 기기의 다른 프로필</p>${others.map(x=>`<div class="prow"><button class="pill" data-pa="use" data-id="${x.id}">${ic("user")} ${E(profName(x))}</button></div>`).join("")}`:""}<p class="sub" style="text-align:center;margin:16px 0 0;font-size:12px"><a href="privacy.html" target="_blank" rel="noopener" style="color:var(--sub)">개인정보처리방침</a></p></div>`;
  if(!$("profDlg").open) $("profDlg").showModal();
}
$("profBtn").addEventListener("click",openProf);
$("profDlg").addEventListener("change",e=>{ const s=e.target.closest("[data-reptitle]"); if(s&&window.PATH){ PATH.setRepTitle(s.value); openProf(); } });
$("profDlg").addEventListener("click",e=>{
  if(e.target===$("profDlg") || e.target.closest("[data-close]")) return $("profDlg").close();
  const b=e.target.closest("[data-pa]"); if(!b) return;
  if(b.dataset.pa==="stats"){ $("profDlg").close(); setView("stats"); return; }
  if(b.dataset.pa==="shop"){ $("profDlg").close(); if(window.PATH) PATH.openShop(); return; }
  if(b.dataset.pa==="logout"){ (async()=>{ try{ clearTimeout(cloudT); cloudPush(); await new Promise(r=>setTimeout(r,600)); await cloud.auth.signOut(); }catch(e){} RAW.set("jp-auth-done",0); switchTo(profiles.find(x=>!x.cloud).id); })(); return; }
  if(b.dataset.pa==="delacct"){ (async()=>{
    if(!confirm("계정을 삭제하면 클라우드에 저장된 학습 기록과 친구·리그 정보가 모두 사라지고 되돌릴 수 없어요.\n정말 삭제할까요?")) return;
    const u=cloud.ok&&cloud.auth.currentUser, p=curProfile(); if(!u||!p.cloud){ toast("로그인 상태에서만 삭제할 수 있어요"); return; }
    const pw=prompt("본인 확인을 위해 비밀번호를 입력해 주세요"); if(pw===null) return;
    try{ await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw)); }catch(e){ toast("비밀번호가 맞지 않아요"); return; }
    clearTimeout(cloudT);
    try{
      try{ const cs=await cloud.db.collection("codes").where("uid","==",u.uid).get(); await Promise.all(cs.docs.map(d=>d.ref.delete())); }catch(e){}
      try{ await cloud.db.collection("users").doc(u.uid).delete(); }catch(e){}
      await u.delete();
    }catch(e){ toast("삭제하지 못했어요. 잠시 뒤 다시 시도해 주세요"); return; }
    profiles=profiles.filter(x=>x.id!==p.id); if(!profiles.some(x=>!x.cloud)) profiles.push({id:"p1",name:"기본"}); saveProfiles(); RAW.set("jp-auth-done",0);
    toast("계정을 삭제했어요"); setTimeout(()=>switchTo(profiles.find(x=>!x.cloud).id),600);
  })(); return; }
  if(b.dataset.pa==="login"||b.dataset.pa==="signup"){ $("profDlg").close(); obFrom=true; obStep="auth"; obAuth=b.dataset.pa; obMsg=""; renderOnb(); return; }
  const id=b.dataset.id; if(b.dataset.pa==="use"&&id!==activeId) switchTo(id);
});
profBtn();
if(curProfile().cloud&&cloud.ok){ cloud.auth.onAuthStateChanged(async u=>{
  const p=curProfile(); if(!p||!p.cloud) return;
  if(!u||u.uid!==p.cloud){ RAW.set("jp-auth-done",0); if(typeof openOnb==="function"){ obStep="auth"; obAuth="login"; obMsg="로그인이 만료됐어요. 다시 로그인해 주세요."; renderOnb(); } return; }
  try{ const d=await cloudPull(u.uid,p.id,false); if(d&&d.applied&&!sessionStorage.getItem("jp-pulled")){ sessionStorage.setItem("jp-pulled","1"); location.reload(); } else if(!d) cloudPush(); }catch(e){}
}); }
// 화면 모드: 화이트 / 다크 / 자동
function applyTheme(){
  const m=RAW.get("jp-theme","auto"), dark=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  document.querySelectorAll("#theme [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===m));
}
$("theme").addEventListener("click",e=>{ const b=e.target.closest("[data-t]"); if(!b) return; RAW.set("jp-theme",b.dataset.t); applyTheme(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
applyTheme();
lvSel=new Set(myLv());
renderLevels(); renderGrid(); setView("home");
</script>
